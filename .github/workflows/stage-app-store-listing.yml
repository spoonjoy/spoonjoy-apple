name: Stage App Store listing

# Writes distribution/app-store/listing.json and its screenshots into the App Store Connect version that
# is being prepared. It never submits for review: submitting stays a human step in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number to attach (required when dry_run is false)
        required: false
        type: string
      dry_run:
        description: Read App Store Connect and print the plan without writing anything
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: spoonjoy-app-store-listing
  cancel-in-progress: false

jobs:
  stage:
    name: Stage listing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: internal-testflight
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
      - name: Stage
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          SPOONJOY_REVIEW_DEMO_USERNAME: ${{ secrets.SPOONJOY_REVIEW_DEMO_USERNAME }}
          SPOONJOY_REVIEW_DEMO_PASSWORD: ${{ secrets.SPOONJOY_REVIEW_DEMO_PASSWORD }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mode=--dry-run
          if [ "$DRY_RUN" = "false" ]; then mode=--apply; fi
          ruby scripts/stage-app-store-listing.rb "$mode" --build-number "$BUILD_NUMBER"
