name: Stage App Store listing

# Writes distribution/app-store/listing.json and its screenshots into the App Store Connect version that
# is being prepared. It never submits for review; "Submit for App Review" (submit-app-store-review.yml) does that.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which version to stage. MAC_OS leaves app-level data to the iOS listing. BOTH stages iOS, then the Mac, with the builds TestFlight published from the source commit.
        required: true
        default: IOS
        type: choice
        options:
          - IOS
          - MAC_OS
          - BOTH
      build_number:
        description: TestFlight build number to attach (required when dry_run is false; leave empty for BOTH)
        required: false
        type: string
      dry_run:
        description: Read App Store Connect and print the plan without writing anything
        required: true
        default: true
        type: boolean
      release_branch:
        description: Read the listing from the head of this release/<version> branch instead of main
        required: false
        type: string

permissions:
  contents: read
  # require-green-commit.rb reads the source commit's Native run, and the frames step finds its Store scenes artifact.
  actions: read

concurrency:
  group: spoonjoy-app-store-listing
  cancel-in-progress: false

jobs:
  stage:
    name: Stage listing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: internal-testflight
    steps:
      - name: Validate release branch
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          if [[ -n "$RELEASE_BRANCH" && ! "$RELEASE_BRANCH" =~ ^release/[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::release_branch must look like release/<version>."
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
      # Publish only from green: the source commit's own Native push run must have passed every required check.
      # The listing comes from the release branch head when one is given, otherwise from main.
      - name: Require a green source commit
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          SOURCE_SHA: ${{ inputs.release_branch == '' && github.sha || '' }}
        run: ruby scripts/require-green-commit.rb --repository "$GITHUB_REPOSITORY" --branch "${RELEASE_BRANCH:-main}" --sha "$SOURCE_SHA"
      - name: Check out the release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.green.outputs.sha }}
          path: release-source
          persist-credentials: false
      # The release train: iOS and the Mac stage the builds TestFlight published from this one source commit, and
      # the run refuses unless both exist and are VALID.
      - name: Find both platforms' builds from the source commit
        id: train
        if: inputs.platform == 'BOTH'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_SHA: ${{ steps.green.outputs.sha }}
        run: |
          if [ -n "$BUILD_NUMBER" ]; then
            echo "::error::Leave build_number empty for BOTH: each platform stages its build from the source commit."
            exit 1
          fi
          ruby scripts/release-train-builds.rb --repository "$GITHUB_REPOSITORY" --sha "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      # Screenshots come from this commit's Store scenes, framed here twice and compared byte for byte. Without
      # scenes for its scene key (or on a release branch cut before frames existed), the checked-in ones are staged.
      - name: Frame the screenshots from Store scenes
        id: frames
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          checked_in=release-source/distribution/app-store/screenshots
          if [ ! -f release-source/distribution/app-store/frames/spec.json ]; then
            echo "::notice title=Checked-in screenshots::This release source has no frames spec; staging $checked_in."
            echo "dir=$checked_in" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="$(node release-source/scripts/store-frames/scene-key.mjs HEAD)"
          url="$(gh api "repos/$REPO/actions/artifacts?name=$key&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].archive_download_url // empty')"
          if [ -z "$url" ]; then
            # A real staging never quietly ships old screenshots; a dry run only warns.
            if [ "$DRY_RUN" = "false" ]; then
              echo "::error title=No Store scenes::No scenes for $key. Run Store scenes with ref set to this release source, then stage again."
              exit 1
            fi
            echo "::warning title=No Store scenes::No scenes for $key; this dry run plans the checked-in screenshots. Run Store scenes on this commit before staging."
            echo "dir=$checked_in" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "$url" > "$RUNNER_TEMP/scenes.zip"
          mkdir -p "$RUNNER_TEMP/scenes"
          unzip -q "$RUNNER_TEMP/scenes.zip" -d "$RUNNER_TEMP/scenes"
          (cd release-source/scripts/store-frames && npm ci --no-audit --no-fund && npx playwright install chromium)
          node release-source/scripts/store-frames/render.mjs --scenes "$RUNNER_TEMP/scenes" --out "$RUNNER_TEMP/frames" --check
          # Framed sets replace their folder; a set no scene makes yet (the Mac) keeps its checked-in screenshots.
          # The header and search art land in creative/, where listing.json's creativeAssets name them.
          out="$RUNNER_TEMP/screenshots"
          if [ -d "$RUNNER_TEMP/frames/creative" ]; then
            mkdir -p "$out/creative"
            cp "$RUNNER_TEMP/frames/creative"/*.png "$out/creative/"
          fi
          for folder in "$checked_in"/*/; do
            name="$(basename "$folder")"
            mkdir -p "$out/$name"
            if [ -d "$RUNNER_TEMP/frames/$name" ]; then
              cp "$RUNNER_TEMP/frames/$name"/*.png "$out/$name/"
            else
              find "$folder" -maxdepth 1 -name '*.png' -exec cp {} "$out/$name/" \;
            fi
          done
          { echo "### Screenshots framed from $key"; echo '```json'; cat "$RUNNER_TEMP/frames/manifest.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
      - name: Stage
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          SPOONJOY_REVIEW_DEMO_USERNAME: ${{ secrets.SPOONJOY_REVIEW_DEMO_USERNAME }}
          SPOONJOY_REVIEW_DEMO_PASSWORD: ${{ secrets.SPOONJOY_REVIEW_DEMO_PASSWORD }}
          APP_REVIEW_CONTACT_PHONE: ${{ secrets.APP_REVIEW_CONTACT_PHONE }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLATFORM: ${{ inputs.platform || 'IOS' }}
          IOS_BUILD_NUMBER: ${{ steps.train.outputs.ios_build_number }}
          IOS_BUILD_ID: ${{ steps.train.outputs.ios_build_id }}
          MAC_BUILD_NUMBER: ${{ steps.train.outputs.mac_build_number }}
          MAC_BUILD_ID: ${{ steps.train.outputs.mac_build_id }}
        run: |
          set -euo pipefail
          mode=--dry-run
          if [ "$DRY_RUN" = "false" ]; then mode=--apply; fi
          if [ "$PLATFORM" = "BOTH" ]; then
            if [ -z "$IOS_BUILD_ID" ] || [ -z "$MAC_BUILD_ID" ]; then
              echo "::error::BOTH needs the iOS and Mac builds from the source commit."
              exit 1
            fi
            plan=("IOS:$IOS_BUILD_NUMBER:$IOS_BUILD_ID" "MAC_OS:$MAC_BUILD_NUMBER:$MAC_BUILD_ID")
            # Both platforms plan first, so one that cannot stage stops the train before anything is written.
            if [ "$mode" = "--apply" ]; then passes=(--dry-run --apply); else passes=(--dry-run); fi
          else
            plan=("$PLATFORM:$BUILD_NUMBER:")
            passes=("$mode")
          fi
          for pass in "${passes[@]}"; do
            for entry in "${plan[@]}"; do
              IFS=: read -r PLATFORM BUILD_NUMBER BUILD_ID <<<"$entry"
              echo "::group::$pass $PLATFORM${BUILD_NUMBER:+ build $BUILD_NUMBER}"
              ruby scripts/stage-app-store-listing.rb "$pass" --platform "$PLATFORM" --build-number "$BUILD_NUMBER" --build-id "$BUILD_ID" \
                --listing release-source/distribution/app-store/listing.json \
                --screenshots "${{ steps.frames.outputs.dir }}" \
                --changes release-source/changes
              echo "::endgroup::"
            done
          done
