name: SDK probe
on:
  push:
    branches: [claude/fold-hinge-27-1]
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Print overlay lines
        run: |
          f=/Applications/Xcode_27.1_beta.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk/System/Library/Frameworks/UIKit.framework/Modules/UIKit.swiftmodule/arm64e-apple-ios.swiftinterface
          sed -n 1960,2060p "$f"
          sed -n 4090,4106p "$f"
          head -12 "$f"
