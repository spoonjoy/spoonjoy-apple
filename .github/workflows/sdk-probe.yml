name: SDK probe
on:
  push:
    branches: [claude/fold-hinge-27-1]
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Dump hinge headers and SwiftUI interface hits
        run: |
          app=/Applications/Xcode_27.1_beta.app
          sdk="$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          h="$sdk/System/Library/Frameworks/UIKit.framework/Headers"
          echo "##### UIViewReservedRegion.h"; cat "$h/UIViewReservedRegion.h"
          echo "##### UIView.h reserved"; sed -n 750,775p "$h/UIView.h"
          echo "##### SwiftUI"
          find "$sdk/System/Library/Frameworks/SwiftUI.framework" -name '*.swiftinterface' | head
          find "$sdk/System/Library/Frameworks/SwiftUI.framework" -name '*.swiftinterface' | head -3 | xargs -I{} grep -nEi "reservedregion|hinge|division" {} | cut -c1-300 | head -60
          echo "##### 27.2 beta"
          sdk2=/Applications/Xcode_27.2_beta.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
          ls "$sdk2/System/Library/Frameworks/UIKit.framework/Headers" | grep -iE "hinge|reserved"
          grep -rlE "ReservedRegion|Hinge" "$sdk2/System/Library/Frameworks/SwiftUI.framework" 2>/dev/null | head
          echo "##### Swift toolchain versions"
          for a in 27.0 27.1_beta 27.2_beta; do echo $a; DEVELOPER_DIR=/Applications/Xcode_$a.app/Contents/Developer xcrun swift -version 2>&1 | head -2; done
