name: SDK probe
on:
  push:
    branches: [claude/fold-hinge-27-1]
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: UIKit swiftinterface hits
        run: |
          app=/Applications/Xcode_27.1_beta.app
          sdk="$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          find "$sdk/System/Library/Frameworks/UIKit.framework" -name '*.swiftinterface'
          for f in $(find "$sdk/System/Library/Frameworks/UIKit.framework" -name 'arm64e-apple-ios.swiftinterface'); do
            echo "## $f"; grep -nEi "reservedregion|hinge|divisionRegion|occlusionRegion" "$f" | cut -c1-350 | head -80
          done
          echo "## SwiftUI any ReservedRegion/Hinge"
          grep -nEi "reservedregion|hinge" "$sdk/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule/arm64e-apple-ios.swiftinterface" | head
          echo "## swift versions"
          for a in 27.0 27.1_beta 27.2_beta; do echo "-- $a"; DEVELOPER_DIR=/Applications/Xcode_$a.app/Contents/Developer xcrun swiftc -version 2>&1 | head -2; done
