name: TestFlight signing dry run

# Signs and exports the TestFlight IPA with the long-lived signing identity, exactly as the
# TestFlight workflow does, but never uploads. Run it from main on demand, for example after
# renewing the certificate secrets. It uses the internal-testflight environment because the
# App Store Connect key lives there, and that environment only admits protected branches.
on:
  workflow_dispatch:

permissions:
  contents: read

# Not the TestFlight group: a pending run there would be replaced by a pending dry run.
concurrency:
  group: testflight-signing-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign-without-upload:
    name: Sign TestFlight IPA without upload
    environment: internal-testflight
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned apple-distribution-kit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ourostack/apple-distribution-kit
          ref: 15ba23ed8a38ef562302db66c68218d8d95aa3a6
          path: .ci/apple-distribution-kit
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: .ci/apple-distribution-kit/package-lock.json

      - name: Build pinned apple-distribution-kit
        working-directory: .ci/apple-distribution-kit
        env:
          EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256: d7e9de5971c036eb180114b1eb648ae9f9fcdffdb44dbcb7fe4cdf670befdac0
        run: |
          set -euo pipefail
          npm ci --loglevel=error
          npm run build
          actual_dist_sha256="$(find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')"
          if [[ "$actual_dist_sha256" != "$EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256" ]]; then
            echo "apple-distribution-kit dist checksum mismatch: $actual_dist_sha256" >&2
            exit 1
          fi
          echo "APPLE_DISTRIBUTION_KIT_BIN=$PWD/dist/cli.js" >> "$GITHUB_ENV"

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version

      - name: Prepare App Store Connect credentials
        id: asc_credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          asc_dir="$RUNNER_TEMP/app-store-connect"
          mkdir -p "$asc_dir"
          key_path="$asc_dir/AuthKey.p8"
          config_path="$asc_dir/config.json"
          python3 - "$key_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["ASC_KEY_BASE64"], validate=True))
          PY
          chmod 600 "$key_path"
          jq -n --arg keyId "$ASC_KEY_ID" --arg issuerId "$ASC_ISSUER_ID" --arg privateKeyPath "$key_path" \
            '{keyId: $keyId, issuerId: $issuerId, privateKeyPath: $privateKeyPath}' > "$config_path"
          chmod 600 "$config_path"
          echo "APPLE_DISTRIBUTION_KIT_CONFIG=$config_path" >> "$GITHUB_ENV"

      - name: Import long-lived signing identity
        id: signing_identity
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/adk-signing"
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing import \
            --keychain "$signing_dir/spoonjoy-ci.keychain-db" \
            --state "$signing_dir/state.json"
          echo "ADK_SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profiles
        run: |
          set -euo pipefail
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing profiles \
            --state "$ADK_SIGNING_DIR/state.json" \
            --team-id 743GT2AJ24 \
            --bundle-id app.spoonjoy \
            --bundle-id app.spoonjoy.cook-timer-widget \
            --xcconfig "$ADK_SIGNING_DIR/signing.xcconfig" \
            --export-options "$ADK_SIGNING_DIR/ExportOptions.plist" \
            --export-options-base distribution/ExportOptions.testflight.plist
          {
            echo "SPOONJOY_SIGNING_XCCONFIG=$ADK_SIGNING_DIR/signing.xcconfig"
            echo "SPOONJOY_EXPORT_OPTIONS_PLIST=$ADK_SIGNING_DIR/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Archive and export without upload
        run: scripts/package-testflight-ios.sh

      - name: Verify the IPA signature
        run: |
          set -euo pipefail
          inspect_dir="$RUNNER_TEMP/ipa-inspect"
          mkdir -p "$inspect_dir"
          ditto -x -k build/apple/testflight/Spoonjoy.ipa "$inspect_dir"
          for bundle in "$inspect_dir"/Payload/Spoonjoy.app "$inspect_dir"/Payload/Spoonjoy.app/PlugIns/*.appex; do
            details="$(codesign -dvv "$bundle" 2>&1)"
            grep -E '^(Identifier|Authority|TeamIdentifier)=' <<<"$details"
            grep -q '^Authority=Apple Distribution: ' <<<"$details" || { echo "$bundle is not signed with Apple Distribution" >&2; exit 1; }
            security cms -D -i "$bundle/embedded.mobileprovision" | plutil -extract Name raw -
          done

      - name: Revoke API-created development certificates (safety net)
        if: always() && steps.asc_credentials.outcome == 'success'
        continue-on-error: true
        run: node "$APPLE_DISTRIBUTION_KIT_BIN" signing revoke-api-certificates --best-effort

      - name: Delete signing keychain
        if: always() && steps.signing_identity.outcome != 'skipped'
        continue-on-error: true
        run: node "$APPLE_DISTRIBUTION_KIT_BIN" signing delete-keychain --keychain "$RUNNER_TEMP/adk-signing/spoonjoy-ci.keychain-db"
