name: Beta SDK

# Builds the iOS app against the newest beta Xcodes on the runner image so code behind new-SDK guards (the iOS 27.1
# hinge APIs) is compiled before that SDK ships. The image has no simulator runtime for these betas, so this proves
# compilation only. It is not a required check and never feeds a shipping build: TestFlight stays on stable Xcode 27.0.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A new push to a pull request cancels its superseded run, so stale runs stop holding the few xcode-27 runners.
  # Every main commit keeps its own run: TestFlight publishes from Native's success on main.
  group: beta-sdk-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Find Xcode 27.1+ on the runner
    runs-on: xcode-27
    timeout-minutes: 5
    outputs:
      xcodes: ${{ steps.find.outputs.xcodes }}
    steps:
      - name: List every Xcode newer than 27.0
        id: find
        # The image renames and drops beta Xcodes over time, so the matrix is read from the runner, never hard-coded.
        # Stable 27.1+ counts too: once it ships, this job keeps proving the hinge code until CI moves to it.
        run: |
          set -euo pipefail
          # The image ships aliases (Xcode_27.1.app, Xcode_27.1.0.app) for one install, so builds are keyed by the
          # real bundle and each install is built once, under the first name that points at it.
          # /bin/bash on macOS is 3.2, which has no associative arrays, so seen bundles go in a newline list.
          seen=""
          names=()
          for app in /Applications/Xcode_*.app; do
            name="${app#/Applications/Xcode_}"; name="${name%.app}"
            real="$(cd "$app" && pwd -P)"
            version="$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo unknown)"
            build="$(defaults read "$app/Contents/version" ProductBuildVersion 2>/dev/null || echo unknown)"
            echo "$name -> $real ($version, $build)"
            awk -F'[._]' '($1 > 27) || ($1 == 27 && $2 >= 1) { ok = 1 } END { exit !ok }' <<<"$name" || continue
            grep -qxF "$real" <<<"$seen" && continue
            seen="$seen"$'\n'"$real"
            names+=("$name")
          done
          xcodes="$(printf '%s\n' ${names[@]+"${names[@]}"} | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "found: $xcodes"
          if [[ "$xcodes" == "[]" ]]; then
            echo "No Xcode 27.1 or newer on the xcode-27 image; the hinge code cannot be compiled." >&2
            exit 1
          fi
          echo "xcodes=$xcodes" >> "$GITHUB_OUTPUT"

  beta-sdk-build:
    name: Beta SDK build (${{ matrix.xcode }})
    needs: discover
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        xcode: ${{ fromJSON(needs.discover.outputs.xcodes) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Select the beta Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Check the hinge guard is on for this SDK
        run: |
          set -euo pipefail
          conditions="$(xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug -sdk iphonesimulator -showBuildSettings 2>/dev/null | grep ' SWIFT_ACTIVE_COMPILATION_CONDITIONS = ')"
          echo "$conditions"
          grep -q SPOONJOY_IOS_27_1_SDK <<<"$conditions"
      - name: Build the iOS app with the hinge code
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/beta-ios-build.log"
          xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/beta-dd" CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee "$log"
          ruby scripts/fail-on-warning.rb --log "$log"
      - name: Check the hinge code is in the built app
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/beta-dd" -name 'Spoonjoy.app' -type d | head -1)"
          test -n "$app"
          grep -rl HingeDivisionView "$app"
