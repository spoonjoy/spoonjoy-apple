name: Actions

# Spoonjoy's actions (Siri, Shortcuts, the shopping list's Add to list) are generated by Ouro UI core from one
# declaration in spoonjoy-v2. This fails when the vendored generator, the declaration or the generated files drift
# from what actions/SOURCE.md pins. Ubuntu and Node only, so it runs in well under a minute.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: actions-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift:
    name: Actions drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
      - name: Check the generator, the declaration and the generated actions
        run: scripts/check-actions-drift.sh
