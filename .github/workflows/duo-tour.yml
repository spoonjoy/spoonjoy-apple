name: Duo tour

# Runs Spoonjoy on an iPhone Duo simulator in its real poses. DeviceHub (Xcode 27.1) stands the inner screen tall and
# half-open, and the tabletop journey runs there with the real hinge instead of the forced posture. Opened flat and
# wide, the spread journeys run, and the last journey leaves a step timer running. The tour then folds the phone through
# open flat, tabletop and shut without relaunching the app, and fails if the timer's end date moves. Last, the app is
# photographed half-open, open tall, open wide and closed, and its page turn halfway. It drives DeviceHub's window
# through accessibility, so it runs on demand rather than on every pull request.

on:
  workflow_dispatch:
    inputs:
      store_links:
        description: Space-separated spoonjoy:// links to photograph open wide, half-open and closed (for App Store art)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: duo-tour-${{ github.ref }}
  cancel-in-progress: true

env:
  SPOONJOY_QA_BASE_URL: https://spoonjoy-v2-qa.mendelow-studio.workers.dev

jobs:
  duo-tour:
    name: Duo tour
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: ./.github/actions/select-xcode
      - name: Require DEBUG in the journeys build configuration
        run: |
          set -euo pipefail
          settings="$(xcodebuild -project Spoonjoy.xcodeproj -target 'Spoonjoy iOS' -configuration BootstrapDebug -sdk iphonesimulator -showBuildSettings)"
          printf '%s\n' "$settings" | grep -Eq '^[[:space:]]*SWIFT_ACTIVE_COMPILATION_CONDITIONS = (.* )?DEBUG( |$)' \
            || { echo "::error::BootstrapDebug does not define DEBUG; SPOONJOY_API_BASE_URL and SPOONJOY_LAUNCH_URL would be ignored."; exit 1; }
      - name: Create and boot an iPhone Duo
        id: sim
        timeout-minutes: 6
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"] and any(d["name"].startswith("iPhone Duo") for d in x.get("supportedDeviceTypes",[]))]; print(max(r, key=lambda x: [int(p) for p in x["version"].split(".")])["identifier"])')"
          udid="$(xcrun simctl create spoonjoy-duo com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$runtime")"
          echo "Created iPhone Duo $udid on $runtime"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "destination=platform=iOS Simulator,arch=$(uname -m),id=$udid" >> "$GITHUB_OUTPUT"
          echo "booted-at=$(date +%s)" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Build for testing
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duo"
          xcodebuild build-for-testing -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug \
            -destination "${{ steps.sim.outputs.destination }}" -only-testing:SpoonjoyJourneys/TabletopJourney \
            -only-testing:SpoonjoyWideJourneys \
            -derivedDataPath "$RUNNER_TEMP/duo/DerivedData" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/duo/build.log"
      - name: Wait for the simulator to settle
        timeout-minutes: 8
        run: python3 .github/scripts/wait-for-simulator-settle.py "${{ steps.sim.outputs.udid }}" --booted-at "${{ steps.sim.outputs.booted-at }}"
      - name: Open the inner screen tall and half-open
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duo/shots"
          swiftc -O .github/scripts/duo/devicehub.swift -o "$RUNNER_TEMP/duo/devicehub"
          open -a "$(xcode-select -p)/../Applications/DeviceHub.app"
          sleep 20
          "$RUNNER_TEMP/duo/devicehub" dump
          "$RUNNER_TEMP/duo/devicehub" press "Open"
          sleep 4
          "$RUNNER_TEMP/duo/devicehub" press "Rotate Right"
          sleep 4
          "$RUNNER_TEMP/duo/devicehub" press "Partially Open"
          sleep 6
          screencapture -x "$RUNNER_TEMP/duo/shots/00-devicehub-half-open-tall.png" || true
          xcrun simctl io "${{ steps.sim.outputs.udid }}" enumerate || true
      - name: Create disposable QA accounts
        run: scripts/journey-qa-accounts.sh create --base-url "$SPOONJOY_QA_BASE_URL" --count 4 --out "$RUNNER_TEMP/duo-secrets/accounts.json"
      - name: Run the tabletop journey on the real hinge
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # See journeys.yml: the runner gets only the path of the 0600 accounts file.
          export TEST_RUNNER_SPOONJOY_JOURNEY_ACCOUNTS_FILE="$RUNNER_TEMP/duo-secrets/accounts.json"
          export TEST_RUNNER_SPOONJOY_JOURNEY_REAL_HINGE=1
          xcodebuild test-without-building -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -only-testing:SpoonjoyJourneys/TabletopJourney/testTabletopCookModeSplitsAtTheFoldJourney \
            -derivedDataPath "$RUNNER_TEMP/duo/DerivedData" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/duo/DuoTour.xcresult" 2>&1 | tee "$RUNNER_TEMP/duo/test.log"
      - name: Run the spread journeys open flat and wide
        # The controls must stay on their pages at the largest text size, and a swipe must turn the step under Reduce
        # Motion. The last journey starts a step timer, prints its cook link and leaves the timer running for the next
        # step. This leaves the Duo open flat and wide.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          hub="$RUNNER_TEMP/duo/devicehub"
          "$hub" press "Open"; sleep 6
          for turn in 1 2 3; do "$hub" press "Rotate Right"; sleep 3; done
          sleep 4
          # Right after the hub opens and turns the Duo, CoreSimulator can refuse launches ("No such process"). A
          # warm-up launch lets it settle, and the journeys run once more only when that launch error is the failure.
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy >/dev/null 2>&1 || true
          sleep 8
          xcrun simctl terminate "$udid" app.spoonjoy >/dev/null 2>&1 || true
          export TEST_RUNNER_SPOONJOY_JOURNEY_ACCOUNTS_FILE="$RUNNER_TEMP/duo-secrets/accounts.json"
          export TEST_RUNNER_SPOONJOY_JOURNEY_REAL_HINGE=1
          # run_journeys <name> <-only-testing selector>: writes Duo<name>.xcresult and test-<name>.log.
          run_journeys() {
            rm -rf "$RUNNER_TEMP/duo/Duo$1.xcresult"
            xcodebuild test-without-building -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug \
              -destination "${{ steps.sim.outputs.destination }}" \
              "-only-testing:$2" \
              -derivedDataPath "$RUNNER_TEMP/duo/DerivedData" \
              -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
              -collect-test-diagnostics never \
              -resultBundlePath "$RUNNER_TEMP/duo/Duo$1.xcresult" 2>&1 | tee "$RUNNER_TEMP/duo/test-$1.log"
          }
          run_with_one_retry() {
            if ! run_journeys "$@"; then
              grep -q "Simulator device failed to launch" "$RUNNER_TEMP/duo/test-$1.log" || return 1
              echo "::warning::The simulator refused a launch; running the $1 journeys once more."
              cp "$RUNNER_TEMP/duo/test-$1.log" "$RUNNER_TEMP/duo/test-$1-launch-failure.log"
              sleep 20
              run_journeys "$@"
            fi
          }
          run_with_one_retry spread SpoonjoyWideJourneys
          # Last, because every journey's fresh launch clears the app's saved state, the running timer included.
          run_with_one_retry timer SpoonjoyJourneys/TabletopJourney/testTimerRunsOnForTheDuoTourJourney
      - name: Fold the phone with the timer running
        # One launch, then DeviceHub moves the hinge: open flat and wide, stood half-open, shut on the cover, and open
        # again. The DEBUG build logs every posture cook mode takes with each running timer's end date
        # (CookTimerProbe). Every posture must appear and every end date must be the one the timer started with.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          hub="$RUNNER_TEMP/duo/devicehub"
          shots="$RUNNER_TEMP/duo/shots"
          [ -f "$RUNNER_TEMP/duo/test-timer.log" ] || { echo "::error::The timer journey never ran (an earlier step failed), so there is no cook link to follow."; exit 1; }
          cook_link="$(grep -o 'Duo tour cook link: spoonjoy://[^ ]*' "$RUNNER_TEMP/duo/test-timer.log" | head -1 | sed 's/^Duo tour cook link: //')"
          [ -n "$cook_link" ] || { echo "::error::The timer journey printed no cook link."; exit 1; }
          probe="$(xcrun simctl get_app_container "$udid" app.spoonjoy data)/tmp/spoonjoy-cook-timer.log"
          shoot() {
            for display in 1 3; do
              xcrun simctl io "$udid" screenshot --display="$display" "$shots/$1-display$display.png" >/dev/null 2>&1 || true
            done
          }
          # The journey left its step timer saved in the app's defaults. If it is gone, cook mode has nothing to keep.
          prefs="$(xcrun simctl get_app_container "$udid" app.spoonjoy data)/Library/Preferences/app.spoonjoy.plist"
          # Read the key whole: plutil's key paths split "cookMode.stepTimerAlarms" at the dot.
          saved="$(python3 -I -c 'import json, plistlib, sys; print(json.dumps(plistlib.load(open(sys.argv[1], "rb")).get("cookMode.stepTimerAlarms") or {}))' "$prefs" 2>/dev/null || true)"
          echo "saved step timers before the fold: ${saved:-none}"
          if [ -z "$saved" ] || [ "$saved" = "{}" ]; then
            echo "::error::No step timer is saved on the Duo before the fold, so there is no running timer to follow. The timer journey's timer did not survive to this step: a journey's fresh launch after it clears the app's saved state."
            exit 1
          fi
          : > "$probe"
          SIMCTL_CHILD_SPOONJOY_API_BASE_URL="$SPOONJOY_QA_BASE_URL" SIMCTL_CHILD_SPOONJOY_LAUNCH_URL="$cook_link" \
            SIMCTL_CHILD_SPOONJOY_JOURNEY_ALARM_FIXTURE=1 \
            xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy
          sleep 14
          shoot 20-timer-open-wide
          "$hub" press "Rotate Right"; sleep 4
          "$hub" press "Partially Open"; sleep 6
          shoot 21-timer-tabletop
          "$hub" press "Closed"; sleep 6
          shoot 22-timer-closed
          "$hub" press "Open"; sleep 6
          for turn in 1 2 3; do "$hub" press "Rotate Right"; sleep 3; done
          sleep 4
          shoot 23-timer-open-wide-again
          cat "$probe"
          failed=0
          for posture in openFlat tabletop closedGlance; do
            grep -q "^posture=$posture " "$probe" || { echo "::error::Cook mode never took the $posture posture."; failed=1; }
          done
          ends="$(sed -n 's/^posture=[^ ]* timers=\(..*\)$/\1/p' "$probe" | sort -u)"
          echo "distinct timer end dates: ${ends:-none}"
          bare="$(sed -n 's/^posture=\([^ ]*\) timers=$/\1/p' "$probe" | sort -u | tr '\n' ' ')"
          if [ -n "$ends" ] && [ -n "$bare" ]; then
            echo "::error::The running timer went missing in these postures: $bare"
            failed=1
          fi
          if [ -z "$ends" ]; then
            echo "::error::A step timer was saved before the fold, but cook mode restored no running timer at any posture."
            failed=1
          elif [ "$(printf '%s\n' "$ends" | wc -l)" -ne 1 ]; then
            echo "::error::The running timer's end date changed as the phone folded: $(printf '%s' "$ends" | tr '\n' ' ')"
            failed=1
          fi
          exit "$failed"
      - name: Photograph every pose
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          hub="$RUNNER_TEMP/duo/devicehub"
          shots="$RUNNER_TEMP/duo/shots"
          # The journey prints the cook link of the recipe it made; the running app (pointed at QA) opens it.
          [ -f "$RUNNER_TEMP/duo/test-timer.log" ] || { echo "::error::The timer journey never ran (an earlier step failed), so there is no cook link to follow."; exit 1; }
          cook_link="$(grep -o 'Duo tour cook link: spoonjoy://[^ ]*' "$RUNNER_TEMP/duo/test-timer.log" | head -1 | sed 's/^Duo tour cook link: //')"
          echo "cook link: ${cook_link:-none}"
          [ -n "$cook_link" ] || { echo "::error::The journey printed no cook link, so the photos would not show cook mode."; exit 1; }
          # The app opens SPOONJOY_LAUNCH_URL itself; `simctl openurl` would stop at the "Open in Spoonjoy?" prompt.
          # The stand-in alarm the timer journey set is shown only with the journeys' alarm fixture.
          launch() {
            SIMCTL_CHILD_SPOONJOY_API_BASE_URL="$SPOONJOY_QA_BASE_URL" SIMCTL_CHILD_SPOONJOY_LAUNCH_URL="$cook_link" \
              SIMCTL_CHILD_SPOONJOY_JOURNEY_ALARM_FIXTURE=1 \
              xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy "$@"
            sleep 12
          }
          shoot() {
            screencapture -x "$shots/$1-devicehub.png" || true
            for display in 1 3; do
              xcrun simctl io "$udid" screenshot --display="$display" "$shots/$1-display$display.png" >/dev/null 2>&1 || true
            done
          }
          # The previous step leaves the Duo open flat and wide; stand it tall and half-open again.
          "$hub" press "Rotate Right"; sleep 4
          "$hub" press "Partially Open"; sleep 6
          launch
          shoot 10-half-open-tall
          xcrun simctl ui "$udid" appearance dark
          launch
          shoot 10d-half-open-tall-dark
          xcrun simctl ui "$udid" appearance light
          SIMCTL_CHILD_SPOONJOY_API_BASE_URL="$SPOONJOY_QA_BASE_URL" SIMCTL_CHILD_SPOONJOY_LAUNCH_URL="${cook_link%/cook}" \
            xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy
          sleep 12
          shoot 10r-recipe-half-open-tall
          xcrun simctl ui "$udid" appearance dark
          SIMCTL_CHILD_SPOONJOY_API_BASE_URL="$SPOONJOY_QA_BASE_URL" SIMCTL_CHILD_SPOONJOY_LAUNCH_URL="${cook_link%/cook}" \
            xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy
          sleep 12
          shoot 10rd-recipe-half-open-tall-dark
          xcrun simctl ui "$udid" appearance light
          xcrun simctl ui "$udid" content_size accessibility-extra-extra-extra-large
          launch
          shoot 10x-half-open-tall-ax5
          xcrun simctl ui "$udid" content_size large
          SIMCTL_CHILD_SPOONJOY_API_BASE_URL="$SPOONJOY_QA_BASE_URL" xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy
          sleep 10
          shoot 10b-kitchen-half-open-tall
          launch
          "$hub" press "Open"; sleep 6
          shoot 11-open-tall
          for turn in 1 2 3; do "$hub" press "Rotate Right"; sleep 3; done
          sleep 4
          shoot 12-open-wide
          xcrun simctl ui "$udid" appearance dark
          launch
          shoot 12d-open-wide-dark
          xcrun simctl ui "$udid" appearance light
          launch
          shoot 13-open-wide-relaunched
          # A DEBUG demo turns one page by itself ten seconds after the spread opens, over eight seconds, so a frame
          # catches the curl halfway; under Reduce Motion the same turn is a crossfade.
          launch -SpoonjoyDemoPageTurn 8
          sleep 3; shoot 15a-page-turn-mid
          sleep 2; shoot 15b-page-turn-mid
          sleep 2; shoot 15c-page-turn-mid
          launch -SpoonjoyReduceMotion YES -SpoonjoyDemoPageTurn 8
          sleep 3; shoot 16a-reduce-motion-crossfade-mid
          sleep 2; shoot 16b-reduce-motion-crossfade-mid
          sleep 2; shoot 16c-reduce-motion-crossfade-mid
          launch
          # Folded shut with cook mode open, the cover becomes the kitchen-timer glance.
          "$hub" press "Closed"; sleep 6
          shoot 14-closed
          # Unfolded again, the glance gives way to the spread.
          "$hub" press "Open"; sleep 6
          shoot 14o-reopened-wide
          xcrun simctl ui "$udid" content_size accessibility-extra-extra-extra-large
          launch
          shoot 13x-open-wide-ax5
          "$hub" press "Closed"; sleep 6
          shoot 14x-closed-ax5
          xcrun simctl ui "$udid" content_size large
          ls -la "$shots"
      - name: Check the open-flat spread
        # The previous step leaves the Duo closed. Opened, it lies flat and wide, and the recipe and cook mode must each
        # open as two pages split at the hinge. The DEBUG build records every layout it resolves (SpreadLayoutProbe);
        # the last line after each launch is what the screen settled on. The Duo is closed again for the store links.
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          [ -f "$RUNNER_TEMP/duo/test-timer.log" ] || { echo "::error::The timer journey never ran (an earlier step failed), so there is no cook link to follow."; exit 1; }
          cook_link="$(grep -o 'Duo tour cook link: spoonjoy://[^ ]*' "$RUNNER_TEMP/duo/test-timer.log" | head -1 | sed 's/^Duo tour cook link: //')"
          [ -n "$cook_link" ] || { echo "::error::The journey printed no cook link."; exit 1; }
          probe="$(xcrun simctl get_app_container "$udid" app.spoonjoy data)/tmp/spoonjoy-spread-layout.log"
          "$RUNNER_TEMP/duo/devicehub" press "Open"
          sleep 6
          failed=0
          for link in "${cook_link%/cook}" "$cook_link"; do
            : > "$probe"
            SIMCTL_CHILD_SPOONJOY_API_BASE_URL="$SPOONJOY_QA_BASE_URL" SIMCTL_CHILD_SPOONJOY_LAUNCH_URL="$link" \
              xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy
            sleep 14
            cat "$probe"
            settled="$(tail -n 1 "$probe")"
            echo "$link settled on: ${settled:-nothing}"
            case "$settled" in
              *"spread source=hardware-division"*) ;;
              *) echo "::error::$link did not open as a spread on the hinge with the Duo open flat: ${settled:-no layout recorded}"; failed=1 ;;
            esac
          done
          "$RUNNER_TEMP/duo/devicehub" press "Closed"
          sleep 6
          exit "$failed"
      - name: Photograph the store links
        if: ${{ !cancelled() && inputs.store_links != '' }}
        timeout-minutes: 15
        env:
          STORE_LINKS: ${{ inputs.store_links }}
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          hub="$RUNNER_TEMP/duo/devicehub"
          shots="$RUNNER_TEMP/duo/shots/store"
          mkdir -p "$shots"
          # The previous step leaves the Duo closed in its default (wide) orientation, signed in as a journey account.
          shoot_links() {
            pose="$1"; n=0
            for link in $STORE_LINKS; do
              n=$((n + 1))
              SIMCTL_CHILD_SPOONJOY_API_BASE_URL="$SPOONJOY_QA_BASE_URL" SIMCTL_CHILD_SPOONJOY_LAUNCH_URL="$link" \
                xcrun simctl launch --terminate-running-process "$udid" app.spoonjoy
              sleep 14
              for display in 1 3; do
                xcrun simctl io "$udid" screenshot --display="$display" "$shots/$pose-$n-display$display.png" >/dev/null 2>&1 || true
              done
              echo "$pose-$n: $link"
            done
          }
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          "$hub" press "Open"; sleep 6
          shoot_links open-wide
          "$hub" press "Rotate Right"; sleep 4
          shoot_links open-tall
          "$hub" press "Partially Open"; sleep 6
          shoot_links half-open-tall
          "$hub" press "Closed"; sleep 6
          shoot_links closed
          ls -la "$shots"
      - name: Print app crash reports
        if: failure()
        run: python3 .github/scripts/print-crash-reports.py "$HOME/Library/Logs/DiagnosticReports"
      - name: Rotate journey account passwords
        id: rotate
        if: always()
        run: scripts/journey-qa-accounts.sh rotate --base-url "$SPOONJOY_QA_BASE_URL" --accounts "$RUNNER_TEMP/duo-secrets/accounts.json"
      - name: Scan artifacts for passwords
        id: scan
        if: always()
        run: |
          scripts/journey-qa-accounts.sh scan --accounts "$RUNNER_TEMP/duo-secrets/accounts.json" \
            "$RUNNER_TEMP/duo/build.log" "$RUNNER_TEMP/duo/test.log" "$RUNNER_TEMP/duo/DuoTour.xcresult" \
            "$RUNNER_TEMP/duo/test-spread.log" "$RUNNER_TEMP/duo/DuoSpread.xcresult" \
            "$RUNNER_TEMP/duo/test-timer.log" "$RUNNER_TEMP/duo/DuoTimer.xcresult"
      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/duo-secrets"
      - name: Upload the tour
        if: ${{ !cancelled() && steps.rotate.outcome == 'success' && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: duo-tour-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/duo/DuoTour.xcresult
            ${{ runner.temp }}/duo/DuoSpread.xcresult
            ${{ runner.temp }}/duo/DuoTimer.xcresult
            ${{ runner.temp }}/duo/shots
            ${{ runner.temp }}/duo/test.log
            ${{ runner.temp }}/duo/test-spread.log
            ${{ runner.temp }}/duo/test-timer.log
          if-no-files-found: warn
          retention-days: 30
