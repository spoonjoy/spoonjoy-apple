name: App Intents X-ray

# The behaviour stage of Ouro AX's X-ray (ourostack/ouro-ui-apple, the version Package.swift pins). Its metadata
# stage runs on every pull request in Native's "App Intents X-ray" job.
on:
  # main runs this from after-testflight.yml, once TestFlight has had the runners.
  workflow_call:
  workflow_dispatch:

concurrency:
  # Every main commit keeps its own run; nothing on main is cancelled.
  group: app-intents-xray-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app-intents-xray-behaviour:
    # The X-ray's behaviour stage runs the app's intents and queries in an iOS 27.1 simulator with AppIntentsTesting.
    # It needs the billed xcode-27 runner, so it runs only on main. Signed out and read-only: BootstrapDebug talks to
    # production, so no refusal runs (no --disposable). Its report is evidence: it is a workflow of its own so it
    # never holds up or fails Native, which TestFlight waits for.
    name: App Intents X-ray (behaviour, main)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Build the iOS app and ouro-ax-xray at the pinned version
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -20
          swift package resolve
          swift build -c release --package-path .build/checkouts/ouro-ui-apple --product ouro-ax-xray
      - name: X-ray behaviour stage (signed out)
        run: |
          set -euo pipefail
          cd .build/checkouts/ouro-ui-apple
          XRAY="$PWD/.build/release/ouro-ax-xray" sh scripts/xray-probe.sh \
            --app "$RUNNER_TEMP/dd/Build/Products/BootstrapDebug-iphonesimulator/Spoonjoy.app" \
            --out "$RUNNER_TEMP/xray-behaviour" --platform ios --runtime 27.1 --name Spoonjoy --commit "${GITHUB_SHA::7}"
      - name: Upload the behaviour report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-intents-xray-behaviour-${{ github.sha }}
          path: ${{ runner.temp }}/xray-behaviour
          if-no-files-found: ignore
