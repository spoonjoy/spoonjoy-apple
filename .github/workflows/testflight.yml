name: TestFlight

on:
  # Continuous delivery: every successful Native push run on main publishes that exact commit.
  workflow_run:
    workflows: [Native]
    types: [completed]
    branches: [main]
  # Manual release, rollback, or build-number override.
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main commit SHA to release (or the head of release_branch)
        required: true
        type: string
      allow_rollback:
        description: Allow an older main ancestor as an explicit rollback
        required: true
        default: false
        type: boolean
      rollback_reason:
        description: Required reason when allow_rollback selects an older main commit
        required: false
        type: string
      rollback_notes:
        description: Fresh TestFlight notes for a rollback whose evidence predates note artifacts, or for a release_branch build
        required: false
        type: string
      build_number:
        description: Optional App Store Connect build number override
        required: false
        type: string
      release_branch:
        description: Publish the head of this release/<version> branch instead of a main commit (iOS only)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: spoonjoy-testflight-internal
  cancel-in-progress: false

jobs:
  reject-untrusted-dispatch:
    name: Reject untrusted dispatch
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject workflow code outside main
        run: |
          echo "TestFlight must be dispatched with workflow ref main." >&2
          exit 1

  release-gate:
    name: Validate release dispatch
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      publish: ${{ steps.select.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
      ROLLBACK_REASON: ${{ inputs.rollback_reason }}
      ROLLBACK_NOTES: ${{ inputs.rollback_notes }}
      RELEASE_BRANCH: ${{ inputs.release_branch }}
    steps:
      - name: Select the release commit
        id: select
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            SOURCE_SHA="$RUN_HEAD_SHA"
            main_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [[ "$SOURCE_SHA" != "$main_head" ]]; then
              echo "Skipping $SOURCE_SHA: main has moved to $main_head, whose own Native run will publish it." >> "$GITHUB_STEP_SUMMARY"
              echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          }
          if [[ -n "$RELEASE_BRANCH" && ! "$RELEASE_BRANCH" =~ ^release/[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "release_branch must look like release/<version>." >&2
            exit 1
          fi
          if [[ "$ALLOW_ROLLBACK" == "true" && -z "${ROLLBACK_REASON//[[:space:]]/}" ]]; then
            echo "rollback_reason is required when allow_rollback is true." >&2
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish-internal:
    name: Publish internal TestFlight
    needs: release-gate
    if: needs.release-gate.outputs.publish == 'true'
    environment: internal-testflight
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out selected source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release-gate.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Native release evidence
        id: candidate
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          SUPERSEDED_OK: ${{ github.event_name == 'workflow_run' }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          ROLLBACK_NOTES: ${{ inputs.rollback_notes }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail
          ../scripts/verify-testflight-release-candidate.rb \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --allow-rollback "$ALLOW_ROLLBACK" \
            --superseded-ok "$SUPERSEDED_OK" \
            --rollback-reason "$ROLLBACK_REASON" \
            --rollback-notes "$ROLLBACK_NOTES" \
            --release-branch "$RELEASE_BRANCH" \
            --output-dir artifacts/apple/ci-testflight/release-candidate

      - name: Upload verified candidate note
        if: steps.candidate.outputs.superseded != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-release-candidate-note-${{ needs.release-gate.outputs.source_sha }}-${{ github.run_id }}
          path: ${{ steps.candidate.outputs.release_notes_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Install pinned source Ruby bundle
        if: steps.candidate.outputs.superseded != 'true'
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: release-source

      - name: Check out pinned apple-distribution-kit
        if: steps.candidate.outputs.superseded != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ourostack/apple-distribution-kit
          ref: c296021af0e7eacb424dc9c7f924c9cda8df9d64
          path: .ci/apple-distribution-kit
          persist-credentials: false

      - name: Set up pinned Node runtime
        if: steps.candidate.outputs.superseded != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: .ci/apple-distribution-kit/package-lock.json

      - name: Build pinned apple-distribution-kit
        if: steps.candidate.outputs.superseded != 'true'
        working-directory: .ci/apple-distribution-kit
        env:
          EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256: 09e0dded99208496bd96cecc6edc067188ec49bae4486b83f90b85e57db954b9
        run: |
          set -euo pipefail
          npm ci --loglevel=error
          npm audit --audit-level=moderate
          npm run build
          actual_dist_sha256="$(find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')"
          if [[ "$actual_dist_sha256" != "$EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256" ]]; then
            echo "apple-distribution-kit dist checksum mismatch: $actual_dist_sha256" >&2
            exit 1
          fi
          echo "APPLE_DISTRIBUTION_KIT_BIN=$PWD/dist/cli.js" >> "$GITHUB_ENV"

      - name: Select and verify Xcode 27 runner
        if: steps.candidate.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          xcrun --sdk iphonesimulator --show-sdk-version
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          first_line="$(printf '%s\n' "$xcode_version" | sed -n '1p')"
          minimum_xcode_version="27.1"
          version="${first_line#Xcode }"
          awk -v version="$version" -v minimum="$minimum_xcode_version" 'BEGIN { split(version, actual, "."); split(minimum, required, "."); exit !((actual[1] + 0) > (required[1] + 0) || ((actual[1] + 0) == (required[1] + 0) && (actual[2] + 0) >= (required[2] + 0))) }'

      - name: Prepare App Store Connect credentials
        if: steps.candidate.outputs.superseded != 'true'
        id: asc_credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=("APP_STORE_CONNECT_API_KEY_ID")
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=("APP_STORE_CONNECT_API_ISSUER_ID")
          [[ -n "$ASC_KEY_BASE64" ]] || missing+=("APP_STORE_CONNECT_API_KEY_BASE64")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          asc_dir="$RUNNER_TEMP/app-store-connect"
          mkdir -p "$asc_dir"
          key_path="$asc_dir/AuthKey.p8"
          config_path="$asc_dir/config.json"

          python3 - "$key_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["ASC_KEY_BASE64"], validate=True))
          PY
          chmod 600 "$key_path"

          python3 - "$config_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$key_path" <<'PY'
          import json
          import pathlib
          import sys

          config_path, key_id, issuer_id, key_path = sys.argv[1:5]
          pathlib.Path(config_path).write_text(
              json.dumps({
                  "keyId": key_id,
                  "issuerId": issuer_id,
                  "privateKeyPath": key_path
              }),
              encoding="utf-8",
          )
          PY
          chmod 600 "$config_path"

          {
            echo "APPLE_DISTRIBUTION_KIT_CONFIG=$config_path"
          } >> "$GITHUB_ENV"

      # Sign with the long-lived Apple Distribution certificate from secrets. The run creates no
      # certificate, and xcodebuild signs manually with no Apple network calls.
      - name: Import long-lived signing identity
        if: steps.candidate.outputs.superseded != 'true'
        id: signing_identity
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/adk-signing"
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing import \
            --keychain "$signing_dir/spoonjoy-ci.keychain-db" \
            --state "$signing_dir/state.json"
          echo "ADK_SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profiles
        if: steps.candidate.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing profiles \
            --state "$ADK_SIGNING_DIR/state.json" \
            --team-id 743GT2AJ24 \
            --bundle-id app.spoonjoy \
            --bundle-id app.spoonjoy.cook-timer-widget \
            --xcconfig "$ADK_SIGNING_DIR/signing.xcconfig" \
            --export-options "$ADK_SIGNING_DIR/ExportOptions.plist" \
            --export-options-base release-source/distribution/ExportOptions.testflight.plist
          {
            echo "SPOONJOY_SIGNING_XCCONFIG=$ADK_SIGNING_DIR/signing.xcconfig"
            echo "SPOONJOY_EXPORT_OPTIONS_PLIST=$ADK_SIGNING_DIR/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Publish exact candidate to Spoonjoy Internal
        if: steps.candidate.outputs.superseded != 'true'
        id: publish
        working-directory: release-source
        env:
          SPOONJOY_TESTFLIGHT_SOURCE_ROOT: ${{ github.workspace }}/release-source
          SPOONJOY_TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
          SPOONJOY_TESTFLIGHT_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          SPOONJOY_TESTFLIGHT_RELEASE_NOTES_PATH: ${{ steps.candidate.outputs.release_notes_path }}
        run: ../scripts/ci-publish-testflight.sh

      # Safety net: a normal run creates no certificate, so this logs "Nothing to revoke".
      - name: Revoke API-created development certificates (safety net)
        if: always() && steps.asc_credentials.outcome == 'success'
        continue-on-error: true
        run: node "$APPLE_DISTRIBUTION_KIT_BIN" signing revoke-api-certificates --best-effort

      - name: Delete signing keychain
        if: always() && steps.signing_identity.outcome != 'skipped'
        continue-on-error: true
        run: node "$APPLE_DISTRIBUTION_KIT_BIN" signing delete-keychain --keychain "$RUNNER_TEMP/adk-signing/spoonjoy-ci.keychain-db"

      - name: Summarize publish
        if: always()
        run: |
          set -euo pipefail
          summary_path="release-source/artifacts/apple/ci-testflight/testflight-publish-summary.json"
          if [[ -f "$summary_path" ]]; then
            {
              echo "## TestFlight publish"
              echo
              jq -r '
                "- Source SHA: \(.sourceSha)",
                "- App Store Connect app id: \(.appId)",
                "- Build: \(.buildNumber) (\(.buildId))",
                "- Build beta detail id: \(.buildBetaDetailId)",
                "- Group: \(.groupName) (\(.groupId))",
                "- Internal state: \(.internalBuildState)",
                "- Testers notified requested: \(.testersNotifiedRequested)"
              ' "$summary_path"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload publish artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-publish-artifacts-${{ needs.release-gate.outputs.source_sha }}
          path: release-source/artifacts/apple/ci-testflight
          if-no-files-found: error
          retention-days: 90

  # The Mac app is the macOS platform of the same universal-purchase App Store record. It ships in its own job so a
  # Mac failure never blocks the iPhone build, and it stops at a VALID upload: release to the App Store stays manual.
  publish-mac-app-store:
    name: Upload Mac App Store build
    needs: release-gate
    # A release branch fixes one iOS version in review; the Mac app ships from main.
    if: needs.release-gate.outputs.publish == 'true' && !inputs.release_branch
    environment: internal-testflight
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out selected source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release-gate.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Native release evidence
        id: candidate
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          SUPERSEDED_OK: ${{ github.event_name == 'workflow_run' }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          ROLLBACK_NOTES: ${{ inputs.rollback_notes }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          set -euo pipefail
          ../scripts/verify-testflight-release-candidate.rb \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --allow-rollback "$ALLOW_ROLLBACK" \
            --superseded-ok "$SUPERSEDED_OK" \
            --rollback-reason "$ROLLBACK_REASON" \
            --rollback-notes "$ROLLBACK_NOTES" \
            --release-branch "$RELEASE_BRANCH" \
            --output-dir artifacts/apple/ci-mac-app-store/release-candidate

      - name: Install pinned source Ruby bundle
        if: steps.candidate.outputs.superseded != 'true'
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: release-source

      - name: Check out pinned apple-distribution-kit
        if: steps.candidate.outputs.superseded != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ourostack/apple-distribution-kit
          ref: c296021af0e7eacb424dc9c7f924c9cda8df9d64
          path: .ci/apple-distribution-kit
          persist-credentials: false

      - name: Set up pinned Node runtime
        if: steps.candidate.outputs.superseded != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: .ci/apple-distribution-kit/package-lock.json

      - name: Build pinned apple-distribution-kit
        if: steps.candidate.outputs.superseded != 'true'
        working-directory: .ci/apple-distribution-kit
        env:
          EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256: 09e0dded99208496bd96cecc6edc067188ec49bae4486b83f90b85e57db954b9
        run: |
          set -euo pipefail
          npm ci --loglevel=error
          npm audit --audit-level=moderate
          npm run build
          actual_dist_sha256="$(find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')"
          if [[ "$actual_dist_sha256" != "$EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256" ]]; then
            echo "apple-distribution-kit dist checksum mismatch: $actual_dist_sha256" >&2
            exit 1
          fi
          echo "APPLE_DISTRIBUTION_KIT_BIN=$PWD/dist/cli.js" >> "$GITHUB_ENV"

      - name: Select and verify Xcode 27 runner
        if: steps.candidate.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcrun --sdk macosx --show-sdk-version
          xcodebuild -version

      - name: Prepare App Store Connect credentials
        if: steps.candidate.outputs.superseded != 'true'
        id: asc_credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=("APP_STORE_CONNECT_API_KEY_ID")
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=("APP_STORE_CONNECT_API_ISSUER_ID")
          [[ -n "$ASC_KEY_BASE64" ]] || missing+=("APP_STORE_CONNECT_API_KEY_BASE64")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          asc_dir="$RUNNER_TEMP/app-store-connect-mac"
          mkdir -p "$asc_dir"
          key_path="$asc_dir/AuthKey.p8"
          config_path="$asc_dir/config.json"
          python3 - "$key_path" "$config_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'PY'
          import base64, json, os, pathlib, sys
          key_path, config_path, key_id, issuer_id = sys.argv[1:5]
          pathlib.Path(key_path).write_bytes(base64.b64decode(os.environ["ASC_KEY_BASE64"], validate=True))
          os.chmod(key_path, 0o600)
          pathlib.Path(config_path).write_text(json.dumps({"keyId": key_id, "issuerId": issuer_id, "privateKeyPath": key_path}), encoding="utf-8")
          os.chmod(config_path, 0o600)
          PY
          {
            echo "APPLE_DISTRIBUTION_KIT_CONFIG=$config_path"
          } >> "$GITHUB_ENV"

      - name: Import long-lived signing identity
        if: steps.candidate.outputs.superseded != 'true'
        id: signing_identity
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/adk-signing-mac"
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing import \
            --keychain "$signing_dir/spoonjoy-mac-ci.keychain-db" \
            --state "$signing_dir/state.json"
          echo "ADK_MAC_SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"

      # The kit imports code signing identities only, so the Mac Installer Distribution identity that signs the .pkg
      # gets its own temporary keychain. The keychain password is random and never leaves this step.
      - name: Import Mac installer identity
        if: steps.candidate.outputs.superseded != 'true'
        id: installer_identity
        env:
          MAC_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$MAC_INSTALLER_CERTIFICATE_P12_BASE64" && -n "$MAC_INSTALLER_CERTIFICATE_PASSWORD" ]] || {
            echo "Missing GitHub secret(s): MAC_INSTALLER_CERTIFICATE_P12_BASE64 / MAC_INSTALLER_CERTIFICATE_PASSWORD" >&2
            exit 1
          }
          keychain="$ADK_MAC_SIGNING_DIR/spoonjoy-mac-installer.keychain-db"
          p12="$ADK_MAC_SIGNING_DIR/installer.p12"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$MAC_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$p12"
          chmod 600 "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MAC_INSTALLER_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/pkgbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          : > "$p12"
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line%\"}"; line="${line#\"}"
            if [[ -n "$line" && "$line" != "$keychain" ]]; then existing+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
          installer_sha1="$(security find-certificate -a -c "Mac Installer Distribution" -Z "$keychain" | awk '/^SHA-1 hash:/ {print $3; exit}')"
          if [[ -z "$installer_sha1" ]]; then
            installer_sha1="$(security find-certificate -a -c "3rd Party Mac Developer Installer" -Z "$keychain" | awk '/^SHA-1 hash:/ {print $3; exit}')"
          fi
          [[ -n "$installer_sha1" ]] || { echo "The installer p12 has no Mac installer certificate." >&2; exit 1; }
          {
            echo "MAC_INSTALLER_KEYCHAIN=$keychain"
            echo "MAC_INSTALLER_SHA1=$installer_sha1"
          } >> "$GITHUB_ENV"

      - name: Install Mac App Store provisioning profile
        if: steps.candidate.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing profiles \
            --state "$ADK_MAC_SIGNING_DIR/state.json" \
            --team-id 743GT2AJ24 \
            --bundle-id app.spoonjoy \
            --profile-type MAC_APP_STORE \
            --name-prefix "ADK CI Mac" \
            --xcconfig "$ADK_MAC_SIGNING_DIR/signing.xcconfig" \
            --export-options "$ADK_MAC_SIGNING_DIR/ExportOptions.plist" \
            --export-options-base release-source/distribution/ExportOptions.mac-app-store.plist
          # macOS Xcode looks for .provisionprofile files; the kit writes .mobileprovision.
          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir" "$HOME/Library/MobileDevice/Provisioning Profiles"
          for profile in "$profiles_dir"/*.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            if [[ -f "$profile" ]]; then cp -f "$profile" "${profile%.mobileprovision}.provisionprofile"; fi
          done
          /usr/libexec/PlistBuddy -c "Add :installerSigningCertificate string $MAC_INSTALLER_SHA1" "$ADK_MAC_SIGNING_DIR/ExportOptions.plist"
          {
            echo "SPOONJOY_MAC_SIGNING_XCCONFIG=$ADK_MAC_SIGNING_DIR/signing.xcconfig"
            echo "SPOONJOY_MAC_EXPORT_OPTIONS_PLIST=$ADK_MAC_SIGNING_DIR/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Upload exact candidate to App Store Connect
        if: steps.candidate.outputs.superseded != 'true'
        working-directory: release-source
        env:
          SPOONJOY_MAC_SOURCE_ROOT: ${{ github.workspace }}/release-source
          SPOONJOY_MAC_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: ../scripts/ci-publish-mac-app-store.sh

      - name: Delete signing keychains
        if: always() && steps.signing_identity.outcome != 'skipped'
        continue-on-error: true
        run: |
          node "$APPLE_DISTRIBUTION_KIT_BIN" signing delete-keychain --keychain "$RUNNER_TEMP/adk-signing-mac/spoonjoy-mac-ci.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/adk-signing-mac/spoonjoy-mac-installer.keychain-db" || true

      - name: Summarize upload
        if: always()
        run: |
          summary_path="release-source/artifacts/apple/ci-mac-app-store/mac-app-store-publish-summary.json"
          if [[ -f "$summary_path" ]]; then
            {
              echo "## Mac App Store upload"
              echo
              jq -r '"- Source SHA: \(.sourceSha)", "- Build: \(.buildNumber) (\(.buildId))", "- State: \(.processingState)"' "$summary_path"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Mac publish artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-app-store-publish-artifacts-${{ needs.release-gate.outputs.source_sha }}
          path: release-source/artifacts/apple/ci-mac-app-store
          if-no-files-found: warn
          retention-days: 90
