name: TestFlight

on:
  # Continuous delivery: every successful Native push run on main publishes that exact commit.
  workflow_run:
    workflows: [Native]
    types: [completed]
    branches: [main]
  # Manual release, rollback, or build-number override.
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main commit SHA to release
        required: true
        type: string
      allow_rollback:
        description: Allow an older main ancestor as an explicit rollback
        required: true
        default: false
        type: boolean
      rollback_reason:
        description: Required reason when allow_rollback selects an older main commit
        required: false
        type: string
      rollback_notes:
        description: Fresh TestFlight notes when rollback evidence predates note artifacts
        required: false
        type: string
      build_number:
        description: Optional App Store Connect build number override
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: spoonjoy-testflight-internal
  cancel-in-progress: false

jobs:
  reject-untrusted-dispatch:
    name: Reject untrusted dispatch
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject workflow code outside main
        run: |
          echo "TestFlight must be dispatched with workflow ref main." >&2
          exit 1

  release-gate:
    name: Validate release dispatch
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.select.outputs.source_sha }}
      publish: ${{ steps.select.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
      ROLLBACK_REASON: ${{ inputs.rollback_reason }}
      ROLLBACK_NOTES: ${{ inputs.rollback_notes }}
    steps:
      - name: Select the release commit
        id: select
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            SOURCE_SHA="$RUN_HEAD_SHA"
            main_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [[ "$SOURCE_SHA" != "$main_head" ]]; then
              echo "Skipping $SOURCE_SHA: main has moved to $main_head, whose own Native run will publish it." >> "$GITHUB_STEP_SUMMARY"
              echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          }
          if [[ "$ALLOW_ROLLBACK" == "true" && -z "${ROLLBACK_REASON//[[:space:]]/}" ]]; then
            echo "rollback_reason is required when allow_rollback is true." >&2
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish-internal:
    name: Publish internal TestFlight
    needs: release-gate
    if: needs.release-gate.outputs.publish == 'true'
    environment: internal-testflight
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out selected source revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release-gate.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Native release evidence
        id: candidate
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-gate.outputs.source_sha }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          ROLLBACK_NOTES: ${{ inputs.rollback_notes }}
        run: |
          set -euo pipefail
          ../scripts/verify-testflight-release-candidate.rb \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --allow-rollback "$ALLOW_ROLLBACK" \
            --rollback-reason "$ROLLBACK_REASON" \
            --rollback-notes "$ROLLBACK_NOTES" \
            --output-dir artifacts/apple/ci-testflight/release-candidate

      - name: Upload verified candidate note
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-release-candidate-note-${{ needs.release-gate.outputs.source_sha }}-${{ github.run_id }}
          path: ${{ steps.candidate.outputs.release_notes_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Install pinned source Ruby bundle
        uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: release-source

      - name: Check out pinned apple-distribution-kit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ourostack/apple-distribution-kit
          ref: ca21426485551dcf35b8456d74d3200697bb2cc1
          path: .ci/apple-distribution-kit
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: .ci/apple-distribution-kit/package-lock.json

      - name: Build pinned apple-distribution-kit
        working-directory: .ci/apple-distribution-kit
        env:
          EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256: 9f64507b03a5dc76a6ebc52f88cddf71f9448a8e532e4758951d2d31309d5a45
        run: |
          set -euo pipefail
          npm ci --loglevel=error
          npm audit --audit-level=moderate
          npm run build
          actual_dist_sha256="$(find dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')"
          if [[ "$actual_dist_sha256" != "$EXPECTED_APPLE_DISTRIBUTION_KIT_DIST_SHA256" ]]; then
            echo "apple-distribution-kit dist checksum mismatch: $actual_dist_sha256" >&2
            exit 1
          fi
          echo "APPLE_DISTRIBUTION_KIT_BIN=$PWD/dist/cli.js" >> "$GITHUB_ENV"

      - name: Select and verify Xcode 27 runner
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          xcrun --sdk iphonesimulator --show-sdk-version
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          first_line="$(printf '%s\n' "$xcode_version" | sed -n '1p')"
          minimum_xcode_version="27.0"
          version="${first_line#Xcode }"
          awk -v version="$version" -v minimum="$minimum_xcode_version" 'BEGIN { split(version, actual, "."); split(minimum, required, "."); exit !((actual[1] + 0) > (required[1] + 0) || ((actual[1] + 0) == (required[1] + 0) && (actual[2] + 0) >= (required[2] + 0))) }'

      - name: Prepare App Store Connect credentials
        id: asc_credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_PROVIDER_PUBLIC_ID: ${{ secrets.APP_STORE_CONNECT_PROVIDER_PUBLIC_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=("APP_STORE_CONNECT_API_KEY_ID")
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=("APP_STORE_CONNECT_API_ISSUER_ID")
          [[ -n "$ASC_KEY_BASE64" ]] || missing+=("APP_STORE_CONNECT_API_KEY_BASE64")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          asc_dir="$RUNNER_TEMP/app-store-connect"
          mkdir -p "$asc_dir"
          key_path="$asc_dir/AuthKey.p8"
          config_path="$asc_dir/config.json"

          python3 - "$key_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["ASC_KEY_BASE64"], validate=True))
          PY
          chmod 600 "$key_path"

          python3 - "$config_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$key_path" <<'PY'
          import json
          import pathlib
          import sys

          config_path, key_id, issuer_id, key_path = sys.argv[1:5]
          pathlib.Path(config_path).write_text(
              json.dumps({
                  "keyId": key_id,
                  "issuerId": issuer_id,
                  "privateKeyPath": key_path
              }),
              encoding="utf-8",
          )
          PY
          chmod 600 "$config_path"

          {
            echo "APPLE_DISTRIBUTION_KIT_CONFIG=$config_path"
            echo "APP_STORE_CONNECT_PROVIDER_PUBLIC_ID=${ASC_PROVIDER_PUBLIC_ID:-9735080289}"
          } >> "$GITHUB_ENV"

      - name: Revoke stale CI-created development certificates
        run: ruby scripts/revoke-ci-signing-certificates.rb

      - name: Publish exact candidate to Spoonjoy Internal
        id: publish
        working-directory: release-source
        env:
          SPOONJOY_TESTFLIGHT_SOURCE_ROOT: ${{ github.workspace }}/release-source
          SPOONJOY_TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
          SPOONJOY_TESTFLIGHT_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          SPOONJOY_TESTFLIGHT_RELEASE_NOTES_PATH: ${{ steps.candidate.outputs.release_notes_path }}
        run: ../scripts/ci-publish-testflight.sh

      - name: Revoke development certificate created by this run
        if: always() && steps.asc_credentials.outcome == 'success'
        continue-on-error: true
        run: ruby scripts/revoke-ci-signing-certificates.rb --best-effort

      - name: Summarize publish
        if: always()
        run: |
          set -euo pipefail
          summary_path="release-source/artifacts/apple/ci-testflight/testflight-publish-summary.json"
          if [[ -f "$summary_path" ]]; then
            {
              echo "## TestFlight publish"
              echo
              jq -r '
                "- Source SHA: \(.sourceSha)",
                "- App Store Connect app id: \(.appId)",
                "- Build: \(.buildNumber) (\(.buildId))",
                "- Build beta detail id: \(.buildBetaDetailId)",
                "- Group: \(.groupName) (\(.groupId))",
                "- Internal state: \(.internalBuildState)",
                "- Testers notified requested: \(.testersNotifiedRequested)"
              ' "$summary_path"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload publish artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-publish-artifacts-${{ needs.release-gate.outputs.source_sha }}
          path: release-source/artifacts/apple/ci-testflight
          if-no-files-found: error
          retention-days: 90
