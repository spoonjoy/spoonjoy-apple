name: Feel

# Ouro Feel over the fixture kitchen (scripts/check-feel.sh) on a hosted simulator: every screen a cook lands on holds
# still once there (no jump, nothing drawn twice, a push or a sheet travelling in), and every screen has a way back.
# A hosted runner has the machine to itself, so a result here does not depend on what else a laptop is running.
# Hitches are recorded, not judged: a debug build on a simulator is not the phone.
on:
  # Pull requests run this from Native, after every required check passes (see native.yml); main runs it from
  # after-testflight.yml, once TestFlight has had the runners.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feel-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    # A pull request runs Feel only when it changes what Feel exercises. The merge commit's first parent is the base
    # branch, so this diff is exactly the pull request's change. main and manual runs always run Feel.
    name: Feel paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Does this change touch what Feel exercises?
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            run=true
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
            while IFS= read -r path; do
              case "$path" in
                Apps/*|Packages/*|Package.swift|Spoonjoy.xcodeproj/*|scripts/check-feel.sh|scripts/capture-native-screenshots.sh|\
                .github/workflows/feel.yml|.github/workflows/native.yml|.github/scripts/create-and-boot-simulator.sh|.github/actions/select-xcode/*)
                  echo "Feel runs: $path changed"
                  run=true
                  ;;
              esac
            done <<<"$changed"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Feel runs: $run" >> "$GITHUB_STEP_SUMMARY"

  feel:
    name: Feel (every screen lands still; the way back)
    needs: paths
    if: needs.paths.outputs.run == 'true'
    runs-on: xcode-27
    # Lane c of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('feel-feel-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || 'spoonjoy-macos-lane-c2' }}
      queue: max
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Create an iPhone on the newest iOS runtime
        id: sim
        timeout-minutes: 26
        run: |
          set -euo pipefail
          .github/scripts/create-and-boot-simulator.sh "iPhone" "feel" "$RUNNER_TEMP/sim.udid"
          echo "udid=$(cat "$RUNNER_TEMP/sim.udid")" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        timeout-minutes: 35
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/feel-dd" 2>&1 | tail -20
      - name: Every screen lands still
        timeout-minutes: 25
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          FEEL_REPORT_DIR: ${{ runner.temp }}/feel-reports/landings
        run: scripts/check-feel.sh "$UDID" "$RUNNER_TEMP/feel-dd" testEveryScreenLandsStill
      # Reported, not yet gating: its first hosted run found misses that hold (#225, #226, #227, and the walk's own
      # misread of the keyboard's Emoji key, ourostack/ouro-ui-apple#60). Its report is in the log and the uploaded
      # artifact. Remove continue-on-error once those are fixed.
      - name: The way back from every screen
        id: wayback
        if: always() && steps.sim.outcome == 'success'
        continue-on-error: true
        # A hosted walk of 18 screens took 27.5 minutes, then over 30 on the next run.
        timeout-minutes: 45
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          FEEL_REPORT_DIR: ${{ runner.temp }}/feel-reports/way-back
        run: scripts/check-feel.sh "$UDID" "$RUNNER_TEMP/feel-dd" testTheWayBackFromEveryScreen
      - name: Say so when the way back misses
        if: always() && steps.wayback.outcome == 'failure'
        run: |
          echo "::warning title=The way back::The way-back walk failed (report only until #225, #226, #227 and ourostack/ouro-ui-apple#60 are fixed); see its step log and the feel-reports artifact."
      - name: Keep the reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: feel-reports
          path: ${{ runner.temp }}/feel-reports
          if-no-files-found: ignore
