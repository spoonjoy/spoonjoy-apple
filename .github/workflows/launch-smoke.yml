name: Launch smoke

# App Review's automated check rejected 1.0 because "the app crashed after the initial launch". This installs the
# Release build fresh on the newest iOS runtime each device supports (iOS 27.1 ships only for the iPhone Duo; other
# iPhones and iPads stop at 27.0), launches it three times signed out, and fails if it stops running or leaves a crash
# report, or if its first sync fails instead of reaching the sign-in screen.
on:
  # Pull requests run this from Native, after every required check passes (see native.yml); main runs it from
  # after-testflight.yml, once TestFlight has had the runners.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-smoke-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The three families install the same Release app, so it is built once and shared.
    name: Launch smoke (build the Release app)
    runs-on: xcode-27
    # Lane c of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('launch-smoke-build-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || 'spoonjoy-macos-lane-c2' }}
      queue: max
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Build the Release app for the simulator
        timeout-minutes: 35
        run: |
          set -euo pipefail
          # Sign ad hoc rather than not at all: an unsigned Release app has no keychain access, so a fresh install
          # shows "We couldn't load your kitchen" instead of the sign-in screen the App Store build shows.
          xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/smoke-dd" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= build 2>&1 | tail -20
      - name: The Release app carries no Ouro Feel recorder
        # The recorder is linked for the UI tests' feel checks, and only a DEBUG build installs it. Nothing of it may
        # reach the App Store build.
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/smoke-dd/Build/Products/Release-iphonesimulator/Spoonjoy.app/Spoonjoy"
          found="$(nm -U "$binary" | grep -c 'OuroFeelRecorder' || true)"
          echo "OuroFeelRecorder symbols in the Release binary: $found"
          if [ "$found" -gt 0 ]; then echo "::error::The Release app links the Ouro Feel recorder"; exit 1; fi
      - name: Pack the app
        # tar keeps the bundle's symlinks, modes and signature, which the artifact zip would not.
        run: tar -C "$RUNNER_TEMP/smoke-dd/Build/Products/Release-iphonesimulator" -cf "$RUNNER_TEMP/Spoonjoy-app.tar" Spoonjoy.app
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: launch-smoke-app
          path: ${{ runner.temp }}/Spoonjoy-app.tar
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  launch-smoke:
    name: Launch smoke (${{ matrix.family }})
    needs: build
    runs-on: xcode-27
    # Lane c of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('launch-smoke-launch-smoke-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || 'spoonjoy-macos-lane-c2' }}
      queue: max
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone Duo, iPhone, iPad]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Create a ${{ matrix.family }} on the newest iOS runtime
        id: sim
        # Each try has its own limits inside the script, with one retry on a fresh device for a runner fault (#218).
        timeout-minutes: 26
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          .github/scripts/create-and-boot-simulator.sh "$FAMILY" "launch-smoke-${FAMILY// /-}" "$RUNNER_TEMP/sim.udid"
          echo "udid=$(cat "$RUNNER_TEMP/sim.udid")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: launch-smoke-app
          path: ${{ runner.temp }}
      - name: Unpack the app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-dd/Build/Products/Release-iphonesimulator"
          tar -C "$RUNNER_TEMP/smoke-dd/Build/Products/Release-iphonesimulator" -xf "$RUNNER_TEMP/Spoonjoy-app.tar"
      - name: Install fresh and launch three times
        timeout-minutes: 8
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/smoke-dd/Build/Products/Release-iphonesimulator/Spoonjoy.app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          mkdir -p "$RUNNER_TEMP/smoke-shots"
          xcrun simctl install "$UDID" "$app"
          failed=0
          for attempt in 1 2 3; do
            xcrun simctl launch "$UDID" "$bundle_id"
            sleep 20
            # The iPhone Duo has two displays, and simctl refuses to guess which one to capture.
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/smoke-shots/launch-$attempt.png" 2>/dev/null \
              || xcrun simctl io "$UDID" screenshot --display=1 "$RUNNER_TEMP/smoke-shots/launch-$attempt.png" || true
            # Capture first: grep -q closes the pipe early, and pipefail turns launchctl's SIGPIPE into a false miss.
            services="$(xcrun simctl spawn "$UDID" launchctl list)"
            if grep -q "UIKitApplication:$bundle_id" <<<"$services"; then
              echo "Launch $attempt: running"
            else
              echo "::error::Launch $attempt: Spoonjoy is not running 20 seconds after launch"
              failed=1
            fi
            xcrun simctl terminate "$UDID" "$bundle_id" || true
            sleep 3
          done
          # A launch that stays up but shows "We couldn't load your kitchen" is not a pass: a fresh, signed-out
          # install must reach the sign-in screen, so any first-sync failure the app logs fails the job.
          bootstrap="$(xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "Spoonjoy" AND eventMessage CONTAINS "native_app_bootstrap_"' || true)"
          echo "$bootstrap"
          if grep -q "native_app_bootstrap_failed" <<<"$bootstrap"; then
            echo "::error::Spoonjoy could not finish its first launch sync (native_app_bootstrap_failed)"
            failed=1
          fi
          if ls "$HOME/Library/Logs/DiagnosticReports"/Spoonjoy* >/dev/null 2>&1; then
            echo "::error::Spoonjoy left a crash report"
            failed=1
          fi
          exit "$failed"
      - name: Print crash reports
        if: always()
        run: python3 .github/scripts/print-crash-reports.py "$HOME/Library/Logs/DiagnosticReports"
      - name: Print the app's log
        if: failure()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "Spoonjoy"' | tail -200 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: launch-smoke-${{ matrix.family == 'iPhone Duo' && 'duo' || matrix.family }}
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: ignore
      - name: Delete the simulator
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          if [ -n "$UDID" ]; then xcrun simctl shutdown "$UDID" || true; xcrun simctl delete "$UDID" || true; fi
