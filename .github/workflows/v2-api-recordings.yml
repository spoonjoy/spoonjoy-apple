name: v2 API recordings

# Fails when docs/source/spoonjoy-v2-api-recordings no longer matches the responses spoonjoy-v2 records on its
# main branch. The daily run catches a v2 API change even when no spoonjoy-apple pull request is open.
# This is a separate workflow because TestFlight publishes from the Native workflow's success on main.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: v2 API recordings match
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Compare with spoonjoy-v2 main
        run: ruby scripts/check-v2-api-recordings.rb
