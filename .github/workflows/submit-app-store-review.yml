name: Submit for App Review

# Submits a version that "Stage App Store listing" has already prepared. Run it with confirm left empty to see
# the plan; it submits only when confirm reads exactly "submit <platform> <version>".
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to submit
        required: true
        default: IOS
        type: choice
        options: [IOS, MAC_OS]
      version:
        description: App Store version string, for example 1.0
        required: true
        type: string
      confirm:
        description: Type "submit <platform> <version>" to submit; leave empty for a dry run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: spoonjoy-app-store-listing
  cancel-in-progress: false

jobs:
  submit:
    name: Submit for review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: internal-testflight
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
      - name: Submit
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          apply=
          if [ "$CONFIRM" = "submit $PLATFORM $VERSION" ]; then apply=--apply; fi
          ruby scripts/submit-app-store-review.rb --platform "$PLATFORM" --version "$VERSION" $apply
