name: Submit for App Review

# Submits a version that "Stage App Store listing" has already prepared. Run it with confirm left empty to see
# the plan; it submits only when confirm reads exactly "submit <platform> <version>".
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to submit
        required: true
        default: IOS
        type: choice
        options: [IOS, MAC_OS]
      version:
        description: App Store version string, for example 1.0
        required: true
        type: string
      confirm:
        description: Type "submit <platform> <version>" to submit; leave empty for a dry run
        required: false
        type: string
      release_branch:
        description: Read the listing from the head of this release/<version> branch instead of main
        required: false
        type: string

permissions:
  contents: read
  # require-green-commit.rb reads the source commit's Native run.
  actions: read

concurrency:
  group: spoonjoy-app-store-listing
  cancel-in-progress: false

jobs:
  submit:
    name: Submit for review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: internal-testflight
    steps:
      - name: Validate release branch
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          if [[ -n "$RELEASE_BRANCH" && ! "$RELEASE_BRANCH" =~ ^release/[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::release_branch must look like release/<version>."
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
      # Publish only from green: the source commit's own Native push run must have passed every required check.
      # The listing comes from the release branch head when one is given, otherwise from main.
      - name: Require a green source commit
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          SOURCE_SHA: ${{ inputs.release_branch == '' && github.sha || '' }}
        run: ruby scripts/require-green-commit.rb --repository "$GITHUB_REPOSITORY" --branch "${RELEASE_BRANCH:-main}" --sha "$SOURCE_SHA"
      - name: Check out the release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.green.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Submit
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          apply=
          if [ "$CONFIRM" = "submit $PLATFORM $VERSION" ]; then
            apply=--apply
          elif [ -n "$CONFIRM" ]; then
            echo "::error::confirm must read exactly \"submit $PLATFORM $VERSION\" (or be empty for a dry run)"
            exit 1
          fi
          ruby scripts/submit-app-store-review.rb --platform "$PLATFORM" --version "$VERSION" \
            --listing release-source/distribution/app-store/listing.json $apply
