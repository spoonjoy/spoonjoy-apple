name: After TestFlight

# main's optional macOS checks (Journeys, Launch smoke, Feel, Beta SDK, the App Intents X-ray behaviour stage) run
# here, once the TestFlight run for the same commit has finished, so they never take a macOS runner TestFlight's
# publish jobs are waiting for. The chain is Native (push to main) -> TestFlight -> this. Every finished TestFlight
# run triggers it, whether it published, skipped or failed, so a red Native on main still gets its optional checks.
# Pull requests run the same workflows from Native instead (native.yml).
on:
  workflow_run:
    workflows: [TestFlight]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# No concurrency group: main runs are never cancelled.

jobs:
  commit:
    # Only TestFlight's automatic runs from main's Native count; a manual dispatch (a rollback, a release branch) does
    # not. A commit main has already moved past is skipped, like TestFlight's own superseded check: the newer
    # commit's chain runs the same checks on code that includes it.
    name: Pick the main commit
    if: >-
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.pick.outputs.run }}
    steps:
      - name: Is this TestFlight run's commit still main's head?
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # testflight.yml names each run "TestFlight <the commit Native built>". The run's own head_sha is main's
          # head when it was created, which can be a newer commit whose TestFlight run hasn't happened yet.
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_TITLE" =~ ^TestFlight\ ([0-9a-f]{40})$ ]]; then
            # Only TestFlight runs created before testflight.yml named its runs; the next commit's chain covers them.
            echo "::warning::TestFlight run name \"$RUN_TITLE\" doesn't name a commit, so no optional checks run for it: $RUN_URL"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_sha="${BASH_REMATCH[1]}"
          main_head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          # The called workflows check out github.sha, so it must be the commit TestFlight finished with.
          if [[ "$source_sha" == "$main_head" && "$CHECKOUT_SHA" == "$source_sha" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Optional checks for $source_sha after TestFlight ($RUN_CONCLUSION): $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $source_sha: main is at $main_head, whose own chain runs the optional checks." >> "$GITHUB_STEP_SUMMARY"
          fi

  journeys:
    name: Journeys
    needs: commit
    if: needs.commit.outputs.run == 'true'
    uses: ./.github/workflows/journeys.yml

  launch-smoke:
    name: Launch smoke
    needs: commit
    if: needs.commit.outputs.run == 'true'
    uses: ./.github/workflows/launch-smoke.yml

  feel:
    name: Feel
    needs: commit
    if: needs.commit.outputs.run == 'true'
    uses: ./.github/workflows/feel.yml

  beta-sdk:
    name: Beta SDK
    needs: commit
    if: needs.commit.outputs.run == 'true'
    uses: ./.github/workflows/beta-sdk.yml

  app-intents-xray:
    name: App Intents X-ray
    needs: commit
    if: needs.commit.outputs.run == 'true'
    uses: ./.github/workflows/app-intents-xray.yml
