name: Native

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A new push to a pull request cancels its superseded run, so stale runs stop holding the few xcode-27 runners.
  # Every main commit keeps its own run: TestFlight publishes from Native's success on main.
  group: native-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruby-advisory-scan:
    name: Ruby advisory scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check native advisory pipeline contract
        run: ruby scripts/check-native-advisory-pipeline.rb
      - name: Scan Ruby dependencies for advisories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-advisory"
          ruby scripts/scan-ruby-advisories.rb \
            --output "$RUNNER_TEMP/native-advisory/ruby-advisory-report.json"
      - name: Upload Ruby advisory report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ruby-advisory-report-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-advisory/ruby-advisory-report.json
          if-no-files-found: ignore
          retention-days: 30

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check native design-language contract
        run: ruby scripts/check-native-design-language.rb --web-design-doc docs/source/spoonjoy-v2-design-language.md
      - name: Check web palette contract
        run: ruby scripts/check-native-web-palette-contract.rb --web-css docs/source/spoonjoy-v2-tailwind-colors.css
      - name: Check Xcode generator contract
        run: bundle exec ruby scripts/check-xcode-generator-contract.rb
      - name: Check coverage and warning gates
        run: ruby scripts/check-coverage-warning-contract.rb
      - name: Check launch screenshot contract
        run: ruby scripts/check-launch-screenshot-contract.rb

  swift-tests:
    # One job runs the whole suite once, with coverage. It is the required "Swift tests" check.
    # SwiftPM only, so it runs on the plentiful macos-26 image (Xcode 26.x) and leaves the scarce xcode-27 runners to the jobs that need the iOS 27 SDK.
    name: Swift tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: ./.github/actions/select-xcode
      - name: Run Swift tests with coverage and enforce 100% SpoonjoyCore coverage
        run: |
          set -euo pipefail
          coverage_log="$RUNNER_TEMP/swift-coverage.log"
          swift test --enable-code-coverage --disable-xctest --parallel -Xswiftc -warnings-as-errors 2>&1 | tee "$coverage_log"
          ruby scripts/fail-on-warning.rb --log "$coverage_log"
          coverage_json="$(swift test --show-codecov-path)"
          ruby scripts/enforce-swift-coverage.rb --coverage-json "$coverage_json" --minimum 100 --include 'Sources/SpoonjoyCore'

  native-scenario-verifier:
    name: Native scenario verifier
    # Plutil/sips checks and SwiftPM executables only, no xcodebuild, so it runs on macos-26.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: ./.github/actions/select-xcode
      - name: Check native project and surface contracts
        # These read the Xcode project with plutil, sips and sw_vers, so they stay on macOS.
        run: |
          set -euo pipefail
          bundle exec ruby scripts/check-xcode-project-contract.rb
          ruby scripts/check-kitchen-recipe-surfaces.rb
          ruby scripts/check-cook-shopping-surfaces.rb
          ruby scripts/check-search-capture-settings-surfaces.rb
      - name: Check journey house rules
        run: swift run -Xswiftc -warnings-as-errors SpoonjoyJourneyRules Apps/Spoonjoy/Journeys .github/workflows/journeys.yml scripts/journey-qa-accounts.sh
      - name: Generate AASA validation or blocker artifact
        run: ruby scripts/validate-aasa.rb --artifact-root "$RUNNER_TEMP/aasa"
      - name: Run native scenario verifier
        run: |
          set -euo pipefail
          test -x scripts/verify-native-scenarios.sh
          scenario_log="$RUNNER_TEMP/native-scenario.log"
          scripts/verify-native-scenarios.sh --stage final 2>&1 | tee "$scenario_log"
          ruby scripts/fail-on-warning.rb --log "$scenario_log"

  testflight-release-note:
    name: TestFlight release note
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ruby-advisory-scan
      - contracts
      - swift-tests
      - native-scenario-verifier
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact Native source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create exact-SHA TestFlight release note
        run: |
          set -euo pipefail
          note_dir="$RUNNER_TEMP/testflight-release-note"
          mkdir -p "$note_dir"
          notes="$(git log -1 --format=%s "$GITHUB_SHA" | tr '\n\r' '  ')"
          [[ -n "${notes//[[:space:]]/}" ]] || {
            echo "The exact source commit must have a non-empty subject for TestFlight notes." >&2
            exit 1
          }
          notes="${notes:0:4000}"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --argjson nativeRunId "$GITHUB_RUN_ID" \
            --argjson nativeRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg generatedAt "$generated_at" \
            --arg notes "$notes" \
            '{
              schemaVersion: 1,
              sourceSha: $sourceSha,
              nativeRunId: $nativeRunId,
              nativeRunAttempt: $nativeRunAttempt,
              generatedAt: $generatedAt,
              notes: $notes
            }' > "$note_dir/testflight-release-notes.json"

      - name: Upload exact-SHA TestFlight release note
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-release-notes-${{ github.sha }}
          path: ${{ runner.temp }}/testflight-release-note/testflight-release-notes.json
          if-no-files-found: error
          retention-days: 90
