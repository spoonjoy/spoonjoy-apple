name: Native

on:
  pull_request:
    # ready_for_review starts a full run on the same commit: a draft runs only lane b (see app-bundle below), so
    # marking it ready is what builds App bundle and starts the optional jobs.
    types: [opened, synchronize, reopened, ready_for_review]
  # main has a merge queue (ruleset "main merge queue"); branch protection is not strict, the queue keeps main current.
  # The merge queue tests each entry on top of main plus the entries ahead of it. Required checks report here;
  # the optional jobs below skip (they run on pull_request) and TestFlight ignores these branches.
  merge_group:
  push:
    branches:
      - main
      # A release branch carries a fix for a version already in review; TestFlight publishes from its Native run.
      - release/**

concurrency:
  # A new push to a pull request cancels its superseded run, so stale runs stop holding the few xcode-27 runners.
  # Every main commit and every merge-queue entry keeps its own run (its sha is unique and never cancelled):
  # TestFlight publishes from Native's success on main.
  group: native-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# macOS lanes. The spoonjoy org (GitHub Free) runs at most 5 macOS jobs at once, xcode-27 included. On 2026-11-11 pull
# request jobs held all 5 for over 90 minutes while a merge-queue entry's jobs, queued earlier, got none. So the macOS
# jobs of pull request, after-TestFlight and dispatch runs join one of three lanes and run one at a time within it,
# waiting (queue: max) instead of queueing for a runner. Lanes a and b are per pull request
# (spoonjoy-macos-lane-a-pr-<number>): one shared lane held about 10 PRs pending for hours on 2026-11-12 while Macs sat
# free, so different PRs' required checks now run side by side. Lane c stays one shared lane for all optional work:
#   lane a: App bundle (required)
#   lane b: Swift tests, Native scenario verifier, Reins journeys (required, short)
#   lane c: every optional job: App Intents X-ray, Journeys, Launch smoke, Feel, Beta SDK, Duo tour
# Required checks never wait behind optional work. Merge-queue and main or release push jobs take a group of their own,
# so at least 2 slots stay outside the lanes; TestFlight, the signing dry run and the review demo launch share those 2
# and are not laned. A lane holds at most 100 waiting jobs; past that GitHub cancels the newest, which only lane c can reach.

permissions:
  contents: read

jobs:
  ruby-advisory-scan:
    name: Ruby advisory scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check native advisory pipeline contract
        run: ruby scripts/check-native-advisory-pipeline.rb
      - name: Scan Ruby dependencies for advisories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-advisory"
          ruby scripts/scan-ruby-advisories.rb \
            --output "$RUNNER_TEMP/native-advisory/ruby-advisory-report.json"
      - name: Upload Ruby advisory report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ruby-advisory-report-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-advisory/ruby-advisory-report.json
          if-no-files-found: ignore
          retention-days: 30

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: The simulator helper picks and lists simulators right (offline, no simulator)
        run: python3 -I .github/scripts/test_create_newest_simulator.py
      - name: Store scenes come out of their result bundle by name (offline)
        run: python3 -I .github/scripts/test_export_store_scenes.py
      - name: Check native design-language contract
        run: ruby scripts/check-native-design-language.rb --web-design-doc docs/source/spoonjoy-v2-design-language.md
      - name: Check web palette contract
        run: ruby scripts/check-native-web-palette-contract.rb --web-css docs/source/spoonjoy-v2-tailwind-colors.css
      - name: Check Xcode generator contract
        run: bundle exec ruby scripts/check-xcode-generator-contract.rb
      - name: Check coverage and warning gates
        run: ruby scripts/check-coverage-warning-contract.rb
      - name: Check launch screenshot contract
        run: ruby scripts/check-launch-screenshot-contract.rb
      - name: Check design accessibility contract
        run: ruby scripts/check-design-accessibility-contract.rb
      - name: Check App Intents contract (every domain)
        run: bundle exec ruby scripts/check-app-intents-contract.rb --domain all
      - name: Check App Store listing and review demo kitchen
        run: |
          ruby scripts/test/app_store_listing_test.rb
          ruby scripts/test/review_demo_kitchen_test.rb
          ruby scripts/test/app_store_review_submission_test.rb
          ruby scripts/test/verify_testflight_release_candidate_test.rb
          ruby scripts/test/green_commit_test.rb
          ruby scripts/test/app_store_release_test.rb
          ruby scripts/test/app_store_review_messages_test.rb
          ruby scripts/test/app_store_crash_diagnostics_test.rb
          ruby scripts/test/app_store_submission_diagnostics_test.rb
          ruby scripts/test/app_review_watch_test.rb
          ruby scripts/test/layout_audit_gate_test.rb
          ruby scripts/test/xray_expectations_test.rb
          ruby scripts/test/ouro_ui_pin_test.rb
          ruby scripts/test/live_journey_failure_test.rb
          ruby scripts/test/parity_sheet_test.rb
          ruby scripts/test/release_branch_workflow_test.rb
          ruby scripts/test/optional_checks_wait_test.rb
          ruby scripts/test/draft_runs_lane_b_test.rb
          ruby scripts/test/no_design_hex_test.rb
          ruby scripts/test/app_shortcuts_test.rb
          ruby scripts/test/app_token_vault_test.rb
          ruby scripts/test/app_server_test.rb
          ruby scripts/test/macos_lanes_test.rb
          ruby scripts/stage-app-store-listing.rb --validate-only
          ruby scripts/stage-app-store-listing.rb --validate-only --platform MAC_OS
          ruby scripts/seed-review-demo-account.rb --validate-only

  swift-tests:
    # One job runs the whole suite once, with coverage. It is the required "Swift tests" check.
    # SwiftPM only, so it runs on the plentiful macos-26 image (Xcode 26.x) and leaves the scarce xcode-27 runners to the jobs that need the iOS 27 SDK.
    name: Swift tests
    runs-on: macos-26
    # Lane b of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('native-swift-tests-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || github.event_name == 'pull_request' && format('spoonjoy-macos-lane-b-pr-{0}', github.event.pull_request.number)
        || 'spoonjoy-macos-lane-b' }}
      queue: max
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: ./.github/actions/select-swift-toolchain
      - name: Run Swift tests with coverage and enforce 100% SpoonjoyCore coverage
        run: |
          set -euo pipefail
          coverage_log="$RUNNER_TEMP/swift-coverage.log"
          # The Reins journeys job runs SpoonjoyReinsTests alone: their network guard is process-wide, so here it would
          # also catch requests from unrelated tests running beside them.
          swift test --enable-code-coverage --disable-xctest --parallel -Xswiftc -warnings-as-errors --skip SpoonjoyReinsTests 2>&1 | tee "$coverage_log"
          ruby scripts/fail-on-warning.rb --log "$coverage_log"
          coverage_json="$(swift test --show-codecov-path)"
          ruby scripts/enforce-swift-coverage.rb --coverage-json "$coverage_json" --minimum 100 --include 'Sources/SpoonjoyCore'

  reins-journeys:
    # The Journeys suite's behaviour, headless: Ouro Reins drives the shell over journey kitchens with every request
    # refused (ReinsNetworkGuard), so no simulator, QA server or account is involved. It is the required "Reins journeys" check.
    name: Reins journeys
    runs-on: macos-26
    # Lane b of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('native-reins-journeys-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || github.event_name == 'pull_request' && format('spoonjoy-macos-lane-b-pr-{0}', github.event.pull_request.number)
        || 'spoonjoy-macos-lane-b' }}
      queue: max
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-swift-toolchain
      - name: Run the headless journeys
        run: |
          set -euo pipefail
          started=$(date +%s)
          swift test --disable-xctest --filter SpoonjoyReinsTests -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/reins.log"
          echo "Headless journeys took $(( $(date +%s) - started ))s (including the build)." >> "$GITHUB_STEP_SUMMARY"
          grep -E '^. Test run with' "$RUNNER_TEMP/reins.log" >> "$GITHUB_STEP_SUMMARY" || true
          # A filter that matches nothing passes with no tests run, so the job counts them: at least one per journey file.
          ran=$(grep -Eo 'Test run with [0-9]+ tests' "$RUNNER_TEMP/reins.log" | grep -Eo '[0-9]+' | tail -1)
          test "${ran:-0}" -ge 23 || { echo "::error::Reins journeys ran ${ran:-0} tests, expected at least 23"; exit 1; }
      - name: Drive spoonjoy-reins from the command line
        run: |
          set -euo pipefail
          swift build -Xswiftc -warnings-as-errors --product spoonjoy-reins
          reins="$(swift build --show-bin-path)/spoonjoy-reins"
          # A journey that runs exits 0.
          "$reins" ls 'do openRecipe {"id":"recipe_lemon_pantry_pasta"}' 'do startCooking' 'do nextStep' 'do goBack'
          # A step the screen doesn't offer is refused: exit 2, with the valid steps named.
          set +e
          "$reins" 'do goBack' > "$RUNNER_TEMP/refused.txt"
          status=$?
          "$reins" 'do openRecipe {"id":"recipe_nope"}' >> "$RUNNER_TEMP/refused.txt"
          invalid=$?
          set -e
          cat "$RUNNER_TEMP/refused.txt"
          test "$status" -eq 2 || { echo "::error::goBack on the Kitchen exited $status, expected 2"; exit 1; }
          test "$invalid" -eq 2 || { echo "::error::opening a recipe that isn't in the kitchen exited $invalid, expected 2"; exit 1; }

  native-scenario-verifier:
    name: Native scenario verifier
    # Plutil/sips checks and SwiftPM executables only, no xcodebuild, so it runs on macos-26.
    runs-on: macos-26
    # Lane b of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('native-native-scenario-verifier-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || github.event_name == 'pull_request' && format('spoonjoy-macos-lane-b-pr-{0}', github.event.pull_request.number)
        || 'spoonjoy-macos-lane-b' }}
      queue: max
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: ./.github/actions/select-swift-toolchain
      - name: Check native project and surface contracts
        # These read the Xcode project with plutil, sips and sw_vers, so they stay on macOS.
        run: |
          set -euo pipefail
          bundle exec ruby scripts/check-xcode-project-contract.rb
          ruby scripts/check-kitchen-recipe-surfaces.rb
          ruby scripts/check-cook-shopping-surfaces.rb
          ruby scripts/check-search-capture-settings-surfaces.rb
      - name: Check journey house rules
        run: swift run -Xswiftc -warnings-as-errors SpoonjoyJourneyRules Apps/Spoonjoy/Journeys .github/workflows/journeys.yml scripts/journey-qa-accounts.sh
      - name: Generate AASA validation or blocker artifact
        run: ruby scripts/validate-aasa.rb --artifact-root "$RUNNER_TEMP/aasa"
      - name: Run native scenario verifier
        run: |
          set -euo pipefail
          test -x scripts/verify-native-scenarios.sh
          scenario_log="$RUNNER_TEMP/native-scenario.log"
          scripts/verify-native-scenarios.sh --stage final 2>&1 | tee "$scenario_log"
          ruby scripts/fail-on-warning.rb --log "$scenario_log"

  app-bundle:
    name: App bundle
    # A draft pull request skips App bundle, and with it every optional job (they need it), so drafts fill only
    # lane b and never the 15-20 min App bundle lane. A skipped check can't merge a draft, and ready_for_review
    # reruns Native on the same commit with App bundle. Re-running an old draft run replays draft: true, so it skips again.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: xcode-27
    # Lane a of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('native-app-bundle-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || github.event_name == 'pull_request' && format('spoonjoy-macos-lane-a-pr-{0}', github.event.pull_request.number)
        || 'spoonjoy-macos-lane-a' }}
      queue: max
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: ./.github/actions/select-xcode
      - name: Build iOS and macOS app bundles
        run: |
          set -euo pipefail
          ios_build_log="$RUNNER_TEMP/xcode-ios-build.log"
          macos_build_log="$RUNNER_TEMP/xcode-macos-build.log"
          xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee "$ios_build_log"
          ruby scripts/fail-on-warning.rb --log "$ios_build_log"
          xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy macOS" -configuration BootstrapDebug -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee "$macos_build_log"
          ruby scripts/fail-on-warning.rb --log "$macos_build_log"
      # The App Intents X-ray job reads the iOS app's App Intents metadata, Info.plist and any skills bundles; only
      # this runner has the iOS 27 SDK to build them, so they travel as a small artifact.
      - name: Collect the iOS app's App Intents metadata for the X-ray
        run: |
          set -euo pipefail
          app="$(xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug -destination 'generic/platform=iOS Simulator' -showBuildSettings -json 2>/dev/null | ruby -rjson -e 'settings = JSON.parse(STDIN.read).find { |entry| entry["target"] == "Spoonjoy iOS" }.fetch("buildSettings"); puts File.join(settings.fetch("BUILT_PRODUCTS_DIR"), settings.fetch("WRAPPER_NAME"))')"
          out="$RUNNER_TEMP/xray-input/Spoonjoy.app"
          mkdir -p "$out"
          cp "$app/Info.plist" "$out/"
          cp -R "$app/Metadata.appintents" "$out/"
          (cd "$app" && find . -name '*.skillsbundle' -type d -prune -exec rsync -R -a {} "$out/" \;)
          ls -R "$out" | head -40
      # Siri only offers a phrase that names the app and whose placeholders are entities; this holds what Xcode compiled
      # to config/app-shortcuts.json, the list the device checklist reads out.
      - name: Check the App Shortcuts Siri can reach
        run: ruby scripts/check-app-shortcuts.rb "$RUNNER_TEMP/xray-input/Spoonjoy.app/Metadata.appintents/extract.actionsdata"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-intents-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/xray-input
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      # App Store review rejects an upload whose bundle has no privacy manifest (ITMS-91053).
      - name: Check both app bundles ship the privacy manifest
        run: |
          set -euo pipefail
          for spec in "Spoonjoy iOS|generic/platform=iOS Simulator|" "Spoonjoy macOS|generic/platform=macOS|Contents/Resources/"; do
            IFS='|' read -r scheme destination resources <<<"$spec"
            app="$(xcodebuild -project Spoonjoy.xcodeproj -scheme "$scheme" -configuration BootstrapDebug -destination "$destination" -showBuildSettings -json 2>/dev/null | ruby -rjson -e 'target = ARGV[0]; settings = JSON.parse(STDIN.read).find { |entry| entry["target"] == target }.fetch("buildSettings"); puts File.join(settings.fetch("BUILT_PRODUCTS_DIR"), settings.fetch("WRAPPER_NAME"))' "$scheme")"
            manifest="$app/${resources}PrivacyInfo.xcprivacy"
            if [ ! -f "$manifest" ]; then
              echo "$scheme bundle is missing ${resources}PrivacyInfo.xcprivacy ($app)"
              exit 1
            fi
            plutil -lint "$manifest"
          done
      # Web's typefaces render only where they are bundled: the iOS app, its cook timer widget and the Mac app each
      # carry every face the type roles use, with its SIL Open Font License text.
      - name: Check every bundle ships the fonts and their licences
        run: |
          set -euo pipefail
          fonts=("Fraunces[SOFT,WONK,opsz,wght].ttf" "SourceSerif4[opsz,wght].ttf" IBMPlexSansCondensed-{Regular,Medium,SemiBold,Bold}.ttf OFL-{Fraunces,SourceSerif4,IBMPlexSansCondensed}.txt)
          for spec in "Spoonjoy iOS|generic/platform=iOS Simulator|" "Spoonjoy iOS|generic/platform=iOS Simulator|PlugIns/SpoonjoyCookTimerWidget.appex/" "Spoonjoy macOS|generic/platform=macOS|Contents/Resources/"; do
            IFS='|' read -r scheme destination resources <<<"$spec"
            app="$(xcodebuild -project Spoonjoy.xcodeproj -scheme "$scheme" -configuration BootstrapDebug -destination "$destination" -showBuildSettings -json 2>/dev/null | ruby -rjson -e 'target = ARGV[0]; settings = JSON.parse(STDIN.read).find { |entry| entry["target"] == target }.fetch("buildSettings"); puts File.join(settings.fetch("BUILT_PRODUCTS_DIR"), settings.fetch("WRAPPER_NAME"))' "$scheme")"
            for font in "${fonts[@]}"; do
              if [ ! -f "$app/$resources$font" ]; then
                echo "$scheme bundle is missing $resources$font ($app)"
                exit 1
              fi
            done
            echo "$scheme $resources: ${#fonts[@]} font and licence files"
          done
      - name: Build the shipping Release configuration (unsigned)
        # TestFlight ships Release, so Release-only code (#if !DEBUG paths, iOS 27 minimums) must compile before release day.
        run: |
          set -euo pipefail
          ios_release_log="$RUNNER_TEMP/xcode-ios-release-build.log"
          macos_release_log="$RUNNER_TEMP/xcode-macos-release-build.log"
          xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee "$ios_release_log"
          ruby scripts/fail-on-warning.rb --log "$ios_release_log"
          xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy macOS" -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO GCC_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee "$macos_release_log"
          ruby scripts/fail-on-warning.rb --log "$macos_release_log"

  app-intents-xray:
    # Ouro AX's X-ray (ourostack/ouro-ui-apple, the version Package.swift pins) checks the App Intents metadata the
    # App bundle job built, on the free macos-26 image, and holds it to config/xray-expected.json.
    # Pull requests only: with strict, up-to-date merges main matches the PR that was checked, and Native's result on
    # main (which TestFlight waits for) stays free of the network fetch this job makes.
    name: App Intents X-ray
    if: github.event_name == 'pull_request'
    # Not required, so like the optional workflows below it waits for every required check before taking a runner.
    needs: [contracts, swift-tests, reins-journeys, native-scenario-verifier, app-bundle]
    runs-on: macos-26
    # Lane c of 3: see the note on macOS lanes at the top of native.yml.
    concurrency:
      group: >-
        ${{ (github.event_name == 'merge_group' || github.event_name == 'push')
        && format('native-app-intents-xray-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index)
        || 'spoonjoy-macos-lane-c' }}
      queue: max
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-swift-toolchain
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-intents-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/xray-input
      - name: Build ouro-ax-xray and ouro-ax-skills at the pinned version
        run: |
          set -euo pipefail
          swift package resolve
          swift build -c release --package-path .build/checkouts/ouro-ui-apple --product ouro-ax-xray
          swift build -c release --package-path .build/checkouts/ouro-ui-apple --product ouro-ax-skills
      # The source bundle, strict, so a warning (a tool named by its type) fails here before it reaches the app.
      - name: Lint the Siri AI app skills
        run: .build/checkouts/ouro-ui-apple/.build/release/ouro-ax-skills lint Apps/Spoonjoy/Shared/Skills.skillsbundle --strict
      - name: X-ray the iOS app's App Intents
        run: |
          set -euo pipefail
          .build/checkouts/ouro-ui-apple/.build/release/ouro-ax-xray --app "$RUNNER_TEMP/xray-input/Spoonjoy.app" \
            --name Spoonjoy --commit "${GITHUB_SHA::7}" --out "$RUNNER_TEMP/xray-report" --format text
      - name: Hold the report to config/xray-expected.json
        run: ruby scripts/check-xray.rb "$RUNNER_TEMP/xray-report/report.json"
      - name: Upload the X-ray report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-intents-xray-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xray-report
          if-no-files-found: ignore

  # Optional checks on a pull request. They start only after every required check (Contracts, Swift tests, Reins
  # journeys, Native scenario verifier, App bundle) has passed, so they never hold a macOS runner that a required job
  # is waiting for; the account has only a few. They show on the pull request as "Journeys / Live journeys" and so on.
  # On main, after-testflight.yml runs the same workflows once TestFlight has finished, so TestFlight's publish jobs
  # never queue behind them. Release branches don't run them.
  journeys:
    name: Journeys
    if: github.event_name == 'pull_request'
    needs: [contracts, swift-tests, reins-journeys, native-scenario-verifier, app-bundle]
    uses: ./.github/workflows/journeys.yml

  launch-smoke:
    name: Launch smoke
    if: github.event_name == 'pull_request'
    needs: [contracts, swift-tests, reins-journeys, native-scenario-verifier, app-bundle]
    uses: ./.github/workflows/launch-smoke.yml

  feel:
    name: Feel
    if: github.event_name == 'pull_request'
    needs: [contracts, swift-tests, reins-journeys, native-scenario-verifier, app-bundle]
    uses: ./.github/workflows/feel.yml

  beta-sdk:
    name: Beta SDK
    if: github.event_name == 'pull_request'
    needs: [contracts, swift-tests, reins-journeys, native-scenario-verifier, app-bundle]
    uses: ./.github/workflows/beta-sdk.yml

  testflight-release-note:
    name: TestFlight release note
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ruby-advisory-scan
      - contracts
      - swift-tests
      - native-scenario-verifier
      - app-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact Native source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          # The parent tells the changelog which fragments this commit added.
          fetch-depth: 2
          persist-credentials: false

      - uses: ruby/setup-ruby@8e41b362d2589a22a44c1cfa214b3c83052c195b # v1
        with:
          ruby-version: '3.3'

      # What to Test comes from the changelog fragments (changes/README.md): the lines this commit added, then the
      # rest of the version's. A commit with no fragment says so and names its subject.
      - name: Create exact-SHA TestFlight release note
        run: |
          set -euo pipefail
          note_dir="$RUNNER_TEMP/testflight-release-note"
          mkdir -p "$note_dir"
          notes="$(ruby scripts/changelog.rb testflight-notes --since "$GITHUB_SHA^")"
          [[ -n "${notes//[[:space:]]/}" ]] || {
            echo "The changelog gave empty TestFlight notes for $GITHUB_SHA." >&2
            exit 1
          }
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --argjson nativeRunId "$GITHUB_RUN_ID" \
            --argjson nativeRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg generatedAt "$generated_at" \
            --arg notes "$notes" \
            '{
              schemaVersion: 1,
              sourceSha: $sourceSha,
              nativeRunId: $nativeRunId,
              nativeRunAttempt: $nativeRunAttempt,
              generatedAt: $generatedAt,
              notes: $notes
            }' > "$note_dir/testflight-release-notes.json"

      - name: Upload exact-SHA TestFlight release note
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-release-notes-${{ github.sha }}
          path: ${{ runner.temp }}/testflight-release-note/testflight-release-notes.json
          if-no-files-found: error
          retention-days: 90
